name: Release SBOM (CycloneDX)

# Every published release carries a signed CycloneDX SBOM of the Go module: sbom.json, checked by
# cmd/sbomcheck, and sbom.json.sig, signed with the selected key (SIGNING_KEY_SOURCE, the interim key by
# default) and verifiable against a key committed under docs/contracts/keys/ (see docs/ci-cd.md). A
# release counts as done only when both files are attached and the signature verifies against a key of
# that set; a release with no SBOM, an unsigned one or a half-finished upload is signed from its tag,
# and a pair that verifies against no key is regenerated only if its release was signed with the current
# key - an old release is never re-signed with a new one (scripts/supplychain/sbom-backfill.sh). A release run
# covers the new tag, the scheduled run backfills anything that was missed, and a push to
# candidate/<anything> runs it in a fork whose default branch does not carry this workflow.
#
# The signing key lives in the release environment. That environment admits main and candidate/*; for
# the run a published release starts (it runs on the tag) to reach the key, the environment must also
# admit the release tags (v*) - a repository setting, recorded in docs/ci-cd.md.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'
  release:
    types: [published]
  push:
    branches: ['candidate/**']

permissions:
  contents: read

concurrency:
  group: release-sbom
  cancel-in-progress: false

jobs:
  # The runner the job that holds the signing key runs on: the repository variable SIGNING_RUNNER, a
  # JSON array of labels, checked here; GitHub's hosted runner while it is unset (docs/ci-cd.md).
  signing-runner:
    name: Signing runner
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.labels.outputs.labels }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the runner labels
        id: labels
        env:
          SIGNING_RUNNER: ${{ vars.SIGNING_RUNNER }}
        run: echo "labels=$(scripts/supplychain/runner-labels.sh)" >> "$GITHUB_OUTPUT"

  sbom:
    name: Generate, sign and attach the SBOM
    needs: [signing-runner]
    runs-on: ${{ fromJSON(needs.signing-runner.outputs.labels) }}
    environment: release
    permissions:
      contents: write # uploads the SBOM and its signature onto the release
    env:
      GH_TOKEN: ${{ github.token }}
      SBOM_NAME: sbom.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag has to be reachable

      - name: Look for a Go module
        id: go-mod
        run: |
          if [ -f go.mod ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo 'No go.mod in the repository - nothing to describe in an SBOM.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Go
        if: steps.go-mod.outputs.exists == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the pinned signing and SBOM tools
        if: steps.go-mod.outputs.exists == 'true'
        run: |
          scripts/tools/install.sh "$RUNNER_TEMP/bin" cosign syft
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The key source (SIGNING_KEY_SOURCE) and its public key: references and paths only, into the job's env.
      - name: Select the signing key
        if: steps.go-mod.outputs.exists == 'true'
        env:
          SIGNING_KEY_SOURCE: ${{ vars.SIGNING_KEY_SOURCE }}
          SIGNING_TRANSIT_KEY: ${{ vars.SIGNING_TRANSIT_KEY }}
          SIGNING_TRANSIT_PATH: ${{ vars.SIGNING_TRANSIT_PATH }}
          SIGNING_VAULT_ADDR: ${{ vars.SIGNING_VAULT_ADDR }}
        run: scripts/supplychain/key-source.sh >> "$GITHUB_ENV"

      - name: Check the signing key
        if: steps.go-mod.outputs.exists == 'true'
        env:
          COSIGN_INTERIM_KEY: ${{ (vars.SIGNING_KEY_SOURCE || 'interim') == 'interim' && secrets.COSIGN_INTERIM_KEY || '' }}
          COSIGN_CLIENT_KEY: ${{ vars.SIGNING_KEY_SOURCE == 'client' && secrets.COSIGN_CLIENT_KEY || '' }}
          COSIGN_PASSWORD: ${{ (vars.SIGNING_KEY_SOURCE || 'interim') == 'interim' && secrets.COSIGN_INTERIM_PASSWORD || (vars.SIGNING_KEY_SOURCE == 'client' && secrets.COSIGN_CLIENT_PASSWORD || '') }}
          VAULT_TOKEN: ${{ vars.SIGNING_KEY_SOURCE == 'openbao-transit' && secrets.SIGNING_VAULT_TOKEN || '' }}
        run: scripts/supplychain/check-key.sh

      - name: Attach a signed SBOM to every release that lacks a verifying one
        if: steps.go-mod.outputs.exists == 'true'
        env:
          COSIGN_INTERIM_KEY: ${{ (vars.SIGNING_KEY_SOURCE || 'interim') == 'interim' && secrets.COSIGN_INTERIM_KEY || '' }}
          COSIGN_CLIENT_KEY: ${{ vars.SIGNING_KEY_SOURCE == 'client' && secrets.COSIGN_CLIENT_KEY || '' }}
          COSIGN_PASSWORD: ${{ (vars.SIGNING_KEY_SOURCE || 'interim') == 'interim' && secrets.COSIGN_INTERIM_PASSWORD || (vars.SIGNING_KEY_SOURCE == 'client' && secrets.COSIGN_CLIENT_PASSWORD || '') }}
          VAULT_TOKEN: ${{ vars.SIGNING_KEY_SOURCE == 'openbao-transit' && secrets.SIGNING_VAULT_TOKEN || '' }}
        run: scripts/supplychain/sbom-backfill.sh

  # ZT-10: the SBOM job.
  # Once the signing jobs have completed, successful or not, their published logs must hold no private-key
  # material (scripts/secrets/log_audit.py signing-audit); the record is counts and verdicts only.
  signing-log-audit:
    name: Signing log audit
    needs: [sbom]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # downloads the signing jobs' published logs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit the signing jobs' logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/secrets/log_audit.py signing-audit --job "Generate, sign and attach the SBOM" --out bundles/signing

      - name: Keep the audit record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-log-audit
          path: bundles/signing
