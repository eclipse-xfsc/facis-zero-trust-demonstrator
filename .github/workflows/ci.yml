name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Go tests
    uses: eclipse-xfsc/dev-ops/.github/workflows/go-test.yml@main
    # The shared workflow defaults to Go 1.24 and cannot read go.mod; keep this
    # in step with the go directive there.
    with:
      go-version: '1.27'

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # golangci-lint refuses a module whose go directive is newer than the Go it
      # was built with, which a published container image cannot follow. Building
      # the pinned version with the toolchain go.mod names keeps the two in step.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.13.2
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  images:
    name: Image build and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, assert Linux and scan every image
        run: |
          shopt -s nullglob
          dockerfiles=(deployment/docker/*/Dockerfile)
          if [ ${#dockerfiles[@]} -eq 0 ]; then
            echo 'No container build context yet - nothing to build.'
            exit 0
          fi
          for dockerfile in "${dockerfiles[@]}"; do
            context=$(dirname "$dockerfile")
            image="ci/$(basename "$context"):${{ github.sha }}"

            docker build --platform linux/amd64 -t "$image" "$context"

            # ZT-13 requires Linux images; assert it rather than trust the Dockerfile.
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            echo "$image platform: $platform"
            if [ "$platform" != "linux/amd64" ]; then
              echo "::error::$image is $platform, ZT-13 requires linux/amd64"
              exit 1
            fi

            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0 image --exit-code 1 --severity HIGH,CRITICAL "$image"
          done

  bdd:
    name: BDD suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install the JavaScript runner
        run: npm ci

      - name: Run the Go scenarios
        run: GODOG_CUCUMBER_OUT=bundles/bdd/go-report.json go test ./internal/bdd

      - name: Run the JavaScript scenarios
        run: npm run bdd

      - name: Merge the reports and generate the traceability sheet
        run: |
          go run ./cmd/bddreport --rows features/annex-rows.txt --out bundles/bdd \
            bundles/bdd/go-report.json bundles/bdd/js-report.json
          cat bundles/bdd/traceability.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bdd-evidence
          path: bundles/bdd

  charts:
    name: Chart lint and render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Lint and render every chart
        run: |
          shopt -s nullglob
          charts=(deployment/helm/*/Chart.yaml)
          if [ ${#charts[@]} -eq 0 ]; then
            echo 'No chart yet - nothing to lint.'
            exit 0
          fi
          for chart in "${charts[@]}"; do
            directory=$(dirname "$chart")
            helm lint "$directory"
            helm template "$directory" >/dev/null
          done
