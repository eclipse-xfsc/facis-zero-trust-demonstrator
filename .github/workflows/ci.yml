name: CI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Go tests
    uses: eclipse-xfsc/dev-ops/.github/workflows/go-test.yml@main
    # The shared workflow defaults to Go 1.24 and cannot read go.mod; keep this
    # in step with the go directive there.
    with:
      go-version: '1.27'

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # golangci-lint refuses a module whose go directive is newer than the Go it
      # was built with, which a published container image cannot follow. Building
      # the pinned version with the toolchain go.mod names keeps the two in step.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.13.2
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  images:
    name: Image build and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, assert Linux and scan every image
        run: |
          shopt -s nullglob
          dockerfiles=(deployment/docker/*/Dockerfile)
          if [ ${#dockerfiles[@]} -eq 0 ]; then
            echo 'No container build context yet - nothing to build.'
            exit 0
          fi
          for dockerfile in "${dockerfiles[@]}"; do
            # The context is the repository root, so an image can take scripts/, ui/ and
            # flows/; .dockerignore keeps local state such as .dev/ out of it.
            image="ci/$(basename "$(dirname "$dockerfile")"):${{ github.sha }}"

            docker build --platform linux/amd64 -f "$dockerfile" -t "$image" .

            role="$(basename "$(dirname "$dockerfile")")"
            case "$role" in
              participant|protected-resource) python3 scripts/ci/check-runtime-files.py "$image" "$role" ;;
            esac

            # ZT-13 requires Linux images; assert it rather than trust the Dockerfile.
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            echo "$image platform: $platform"
            if [ "$platform" != "linux/amd64" ]; then
              echo "::error::$image is $platform, ZT-13 requires linux/amd64"
              exit 1
            fi

            # A time-boxed, documented exception may exclude named upstream paths from the gate;
            # an expired exception fails the build. Everything else stays under the gate.
            skips=()
            exception="$(dirname "$dockerfile")/scan-exception.json"
            if [ -f "$exception" ]; then
              expires=$(jq -r '.expires' "$exception")
              if [[ "$(date -u +%F)" > "$expires" ]]; then
                echo "::error::$exception expired on $expires - renew it or remove the upstream findings"
                exit 1
              fi
              mapfile -t skips < <(jq -r '(.skipDirs[] | "--skip-dirs", .), (.skipFiles[] | "--skip-files", .)' "$exception")
              {
                echo "### Scan exception for $image (expires $expires)"
                jq -r '.reason, "", .tracking, "", "Excluded: " + ((.skipDirs + .skipFiles) | join(", "))' "$exception"
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            vex=()
            if [ -f "$(dirname "$dockerfile")/vex.json" ]; then
              # Exact component/revision statements retain fixed-version attribution for upstream
              # binaries whose Go pseudo-version sorts below their actual release version.
              vex=(--vex "/source/$(dirname "$dockerfile")/vex.json" --show-suppressed)
              echo "Version attribution: $(dirname "$dockerfile")/vex.json" >> "$GITHUB_STEP_SUMMARY"
            fi
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/source:ro" \
              aquasec/trivy:0.74.0 image --exit-code 1 --severity HIGH,CRITICAL "${skips[@]}" "${vex[@]}" "$image"
          done

  # The signing profile end to end: the release signing script signs and attests throwaway images
  # with the pinned cosign and an ephemeral key, in a registry:2 on the runner, and the admission
  # provider verifies them. No secret and no external push.
  admission-interop:
    name: Admission provider interop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Start a local registry and install the pinned cosign
        run: |
          . scripts/tools/pins.env
          docker run -d --name registry -p 127.0.0.1:5000:5000 "$REGISTRY_IMAGE"
          scripts/tools/install.sh "$RUNNER_TEMP/bin" cosign

      - name: Sign, attest and verify through the provider
        run: go test -count=1 -run Interop -v ./services/admission-provider/
        env:
          FACIS_INTEROP_REGISTRY: localhost:5000
          COSIGN: ${{ runner.temp }}/bin/cosign

  # The constraints that need nothing but the object (digest-only, allowed repositories, naming, the
  # namespace scope), tested offline with the pinned gator.
  gator:
    name: Admission constraints (gator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned gator
        run: scripts/tools/install.sh "$RUNNER_TEMP/bin" gator

      - name: Verify the constraint suite
        run: '"$RUNNER_TEMP/bin/gator" verify -v deployment/admission'

      - name: Test the enforcement check
        run: scripts/admission/enforced_test.sh

  # The trust-framework DNS inspector against local NSD servers that each break one thing it must
  # catch (a wrong DS digest, an unsigned server, a diverging NS set, a resolver without the URI),
  # and through a signed parent zone and a validating Unbound for the delegation path. The servers
  # listen on loopback port 53, so the job runs as root in a container.
  train-dns:
    name: TRAIN DNS inspector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ubuntu:24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install NSD, Unbound, ldns and dig
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get -qq update && apt-get -qq install -y --no-install-recommends nsd ldnsutils unbound dnsutils python3 >/dev/null

      - name: Run the inspector cases
        run: bash scripts/verify-train-dns/verify_test.sh

  # The whole admission catalogue in a real Gatekeeper: a kind cluster with Gatekeeper (pinned chart,
  # cache off), the provider and a local registry of test images signed with the release script and
  # an ephemeral key. Includes provider-down, Gatekeeper-down and trust-removal cases.
  admission-kind:
    name: Admission catalogue (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0

      - name: Install the pinned tools
        run: scripts/tools/install.sh "$RUNNER_TEMP/bin" kind kubectl cosign syft gatekeeper-chart

      - name: Run the admission catalogue
        run: BIN="$RUNNER_TEMP/bin" scripts/admission/kind-e2e.sh

  # The admission reconciler (deployment/argocd, ZT-12): Argo CD on a kind cluster with Gatekeeper, handed
  # the admission policy of the revision under test, fetched from the repository it came from. The
  # checkout is that same revision (the pull request's head, not the merge commit), so the catalogue in
  # the cluster can be compared with the files. Proves every Application Synced and Healthy, the zone's
  # repository prefix patched in, a hand-edited constraint and a hand-edited child put back, and the
  # sync status in the controller's metrics.
  admission-gitops:
    name: Admission reconciler (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0

      - name: Install the pinned tools
        run: scripts/tools/install.sh "$RUNNER_TEMP/bin" kind kubectl gatekeeper-chart argocd-chart

      - name: Run the reconciler scenarios
        env:
          REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: BIN="$RUNNER_TEMP/bin" scripts/argocd/kind-e2e.sh

  # The demonstrator cluster's no-sidecar-in-planes (ADR-0018) in a throwaway kind cluster: the
  # shapes it must refuse in the namespaces enrolled in the ambient mesh, on every write path of a
  # pod (create, pods/status, pods/ephemeralcontainers), and the mesh's own pods it must admit.
  ambient-admission-kind:
    name: Ambient admission (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0

      - name: Install the pinned tools
        run: scripts/tools/install.sh "$RUNNER_TEMP/bin" kind kubectl

      - name: Run the admission cases
        run: BIN="$RUNNER_TEMP/bin" scripts/verify-ambient-mesh/admission-kind.sh

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install the JavaScript tooling
        run: npm ci

      # Schemas compile, valid fixtures pass and invalid ones fail, reason codes are registered,
      # OpenAPI documents are valid OpenAPI 3.1 with resolvable references.
      - name: Validate the interface contracts
        run: npm run contracts

  bdd:
    name: BDD suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install the JavaScript runner
        run: npm ci

      - name: Test the ORCE Builder nodes
        run: node --test ui/nodes/*/test/*.test.mjs

      # Every scenario is the Annex wording, every row has one, and the generated files are current.
      - name: Check the pack against Annex A
        run: go run ./cmd/bddpack -check

      # Strict: the implemented, non-cluster scenarios. A pending or undefined step fails.
      - name: Run the Go scenarios
        run: GODOG_CUCUMBER_OUT=bundles/bdd/go-report.json go test ./internal/bdd

      - name: Run the JavaScript scenarios
        run: npm run bdd

      # The rows not implemented yet, reported as not run rather than as gaps.
      - name: Run the pending catalogue
        run: |
          BDD_MODE=catalogue GODOG_CUCUMBER_OUT=bundles/bdd/go-catalogue-report.json go test ./internal/bdd
          npm run bdd:catalogue

      # The cluster rows cannot run here; a dry run lists them as not run. Only this job's sheet
      # merges it: the cluster jobs never do, so it cannot stand in for a real cluster run.
      - name: List the cluster scenarios
        run: |
          npm run bdd:cluster-dryrun
          BDD_MODE=cluster-dryrun GODOG_CUCUMBER_OUT=bundles/bdd/go-cluster-dryrun.json go test ./internal/bdd

      - name: Merge the reports and generate the traceability sheet
        if: always()
        run: |
          go run ./cmd/bddreport --require-complete --rows features/annex-rows.txt --out bundles/bdd \
            bundles/bdd/go-report.json bundles/bdd/js-report.json \
            bundles/bdd/go-catalogue-report.json bundles/bdd/js-catalogue-report.json \
            bundles/bdd/js-cluster-dryrun.json bundles/bdd/go-cluster-dryrun.json
          cat bundles/bdd/traceability.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the evidence bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bdd-evidence
          path: bundles/bdd

  charts:
    name: Chart lint and render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          # One pinned Helm for QA and for the lifecycle workflow; its flags differ by major version.
          version: v4.3.0

      # The fixture chart under features/ is linted like a release chart: the TDR's lint and
      # dry-run rule applies to every chart the pipeline installs. A chart whose values have no
      # defaults ships its valid baseline in ci/values.yaml. The same script is the release gate,
      # where it adds a server dry-run against a disposable cluster (release.yml, TDR-BDD-11), and
      # packages the charts when a release is published (release-charts below), so the gate a pull
      # request clears is the gate the release is held to. The umbrella is also rendered with every
      # shipped zone file under deployment/helm/ztd/zones/ (the example excepted), so a zone file
      # that stops rendering is caught here rather than by an operator on the cluster. Rendering only.
      # The demonstrator cluster's ionos.yaml keeps its API endpoint addresses out of the repository
      # and does not render alone (its CNI derogation requires them): it is rendered with the
      # documentation-range overlay ci/ionos.overlay.yaml, and must also be refused without it. The
      # derogation's other render guards are checked here too, each refusal by its message: ambient
      # without the derogation, the derogation with sidecar mode, and the derogation without the
      # webhook source pods (fromPods), each with the overlay so the addresses are not the cause.
      - name: Lint and render every chart
        run: |
          scripts/ci/check-charts.sh
          refused() { # refused <message pattern> <title> <helm template arguments...>
            local pattern=$1 title=$2 out; shift 2
            if out=$(helm template deployment/helm/ztd "$@" 2>&1); then
              echo "rendered, but must be refused: $title" >&2; exit 1
            fi
            grep -q -- "$pattern" <<<"$out" || { echo "refused, but not on its guard: $title" >&2; echo "$out" >&2; exit 1; }
            echo "refused as expected: $title"
          }
          ionos=(-f deployment/helm/ztd/zones/ionos.yaml -f deployment/helm/ztd/ci/ionos.overlay.yaml)
          refused 'mesh.mode ambient needs Cilium' "ambient without Cilium and without the derogation" "${ionos[@]}" --set cni.derogation=
          refused "at '/mesh/mode'" "the derogation with sidecar mode" "${ionos[@]}" --set mesh.mode=sidecar
          refused "missing property 'fromPods'" "the derogation without controlPlaneWebhooks.fromPods" "${ionos[@]}" --set networkPolicy.controlPlaneWebhooks.fromPods=null
          for zone in deployment/helm/ztd/zones/*.yaml; do
            [ "$(basename "$zone")" = zone-a.example.yaml ] && continue
            overlay=()
            if [ "$(basename "$zone")" = ionos.yaml ]; then
              overlay=(-f deployment/helm/ztd/ci/ionos.overlay.yaml)
              if helm template deployment/helm/ztd -f "$zone" >/dev/null 2>&1; then
                echo "$zone rendered without the API endpoint addresses" >&2; exit 1
              fi
            fi
            echo "render deployment/helm/ztd with $zone ${overlay[*]}"
            helm lint deployment/helm/ztd -f "$zone" "${overlay[@]}"
            helm template deployment/helm/ztd -f "$zone" "${overlay[@]}" >/dev/null
          done

      # What the release relies on, against charts the test writes: a set that passes is packaged
      # at the version with matching checksums, and one failing chart leaves no package at all.
      - name: Test the chart check
        run: scripts/ci/check-charts_test.sh

      # A sidecar zone is eight releases (scripts/install-zone/install.sh): three project charts linted above
      # (the umbrella, zone-policy and ztd-openbao, the last wrapping the upstream openbao chart from
      # its Chart.lock) and five upstream charts, SPIRE's and Istio's, pinned by version and digest in
      # the installer. Each upstream release is rendered from its pinned chart with its values file
      # under deployment/helm/values/ and the kind zone's facts, and ztd-openbao through the installer
      # with the zone facts it reads from the umbrella's defaults and the zone file: its server
      # StatefulSet and both of its jobs must carry the identity label the registration rule selects,
      # and none may carry a node affinity or a node selector, with the kind zone's file and with zone
      # A's. Rendering only: CI never installs.
      # The rendered istiod mesh configuration must carry the TLS 1.3 minimum of the security
      # baseline (ADR 005), and the installer must refuse an unknown mesh mode, and a revisioned zone
      # in either mode, before it renders anything (it installs the default, unrevisioned istiod in
      # sidecar or ambient mode only), and a zone-policy whose proxy image or status port differs
      # from istiod's before it renders anything. The ambient path (the demonstrator cluster,
      # ADR-0018) renders its six releases with the overlay below.
      - name: Render the upstream releases of a zone
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
          RENDER_DIR="$RUNNER_TEMP/render" \
            scripts/install-zone/install.sh render spire-crds spire istio-base istiod istio-cni ztd-openbao
          RENDER_DIR="$RUNNER_TEMP/render-zone-a" ZONE_VALUES=deployment/helm/ztd/zones/zone-a.yaml \
            scripts/install-zone/install.sh render ztd-openbao
          python3 - "$RUNNER_TEMP/render/ztd-openbao.yaml" "$RUNNER_TEMP/render-zone-a/ztd-openbao.yaml" <<'PY'
          import sys, yaml
          def pods(path):
              docs = [d for d in yaml.safe_load_all(open(path)) if d]
              found = {}
              for d in docs:
                  kind, name = d.get("kind"), d["metadata"]["name"]
                  if kind == "StatefulSet" and name == "ztd-openbao": found["server"] = d
                  elif kind == "Job" and name.startswith("ztd-openbao-bootstrap-"): found["bootstrap"] = d
                  elif kind == "Job" and name == "ztd-verify-openbao": found["verification"] = d
              missing = {"server", "bootstrap", "verification"} - set(found)
              if missing: sys.exit(f"ztd-openbao render {path}: no {', '.join(sorted(missing))}")
              return {k: v["spec"]["template"] for k, v in found.items()}
          def node_pin(t):
              # No release is held to a node: no node affinity and no node selector on any pod template.
              spec = t["spec"]
              return {k: v for k, v in (("nodeAffinity", (spec.get("affinity") or {}).get("nodeAffinity")),
                                         ("nodeSelector", spec.get("nodeSelector"))) if v}
          accounts = {"server": "ztd-openbao", "bootstrap": "ztd-openbao-bootstrap", "verification": "ztd-verify-openbao"}
          for zone, path in (("kind", sys.argv[1]), ("zone-a", sys.argv[2])):
              for name, t in pods(path).items():
                  label = (t["metadata"].get("labels") or {}).get("spiffe.io/spire-managed-identity")
                  if label != "true":
                      sys.exit(f"ztd-openbao render ({zone}): the {name} pod template lacks spiffe.io/spire-managed-identity: \"true\"")
                  if node_pin(t):
                      sys.exit(f"ztd-openbao render ({zone}): the {name} pod template is held to a node: {node_pin(t)}")
                  # Each pod its own ServiceAccount, so each its own SPIFFE ID (none on "default").
                  sa = t["spec"].get("serviceAccountName") or "default"
                  if sa != accounts[name]:
                      sys.exit(f"ztd-openbao render ({zone}): the {name} pod runs as ServiceAccount {sa}, not {accounts[name]}")
              print(f"ztd-openbao render ({zone}): the server and both jobs carry the identity label, each with its own ServiceAccount, and none is held to a node")
          PY
          python3 - "$RUNNER_TEMP/render/istiod.yaml" <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          cm = [d for d in docs if d.get("kind") == "ConfigMap" and d["metadata"]["name"] == "istio"]
          mesh = yaml.safe_load(cm[0]["data"]["mesh"]) if cm else {}
          got = ((mesh or {}).get("meshMTLS") or {}).get("minProtocolVersion")
          if got != "TLSV1_3":
              sys.exit(f"istiod render: meshConfig.meshMTLS.minProtocolVersion is {got!r}, not 'TLSV1_3' (ADR 005)")
          print("istiod render: meshConfig.meshMTLS.minProtocolVersion is TLSV1_3")
          PY
          # Each case: the settings under mesh (key=value,...) and the key the refusal must name.
          for case in revision=canary:revision mode=ambient,revision=canary:revision mode=both:mode; do
            settings=${case%%:*}; key=${case##*:}
            name=${settings//[=,]/-}
            zone="$RUNNER_TEMP/zone-$name.yaml"
            out="$RUNNER_TEMP/refused-$name"
            mkdir -p "$out"
            python3 - deployment/helm/ztd/ci/values.yaml "$settings" "$zone" <<'PY'
          import sys, yaml
          source, settings, target = sys.argv[1:]
          zone = yaml.safe_load(open(source))
          for pair in settings.split(","):
              k, v = pair.split("=")
              zone.setdefault("mesh", {})[k] = v
          yaml.safe_dump(zone, open(target, "w"), sort_keys=False)
          PY
            if ZONE_VALUES="$zone" RENDER_DIR="$out" \
                scripts/install-zone/install.sh render 2>"$out.err"; then
              echo "install-zone rendered a zone with mesh $settings" >&2; exit 1
            fi
            cat "$out.err"
            grep -q "mesh\.$key" "$out.err" || { echo "the refusal does not name mesh.$key" >&2; exit 1; }
            [ -z "$(ls -A "$out")" ] || { echo "install-zone rendered into $out before refusing" >&2; exit 1; }
          done
          # The ambient path (ADR-0018): the demonstrator cluster's zone file with the overlay plans
          # the six releases in order, with no SPIRE or OpenBao release; istiod names no SPIRE
          # socket or certificate provider and runs in the zone's trust domain; istio-cni has
          # ambient on; ztunnel and istio-cni are DaemonSets at system-node-critical, by digest, and
          # istiod is by digest;
          # zone-policy is the STRICT PeerAuthentication, the lane-port DENY AuthorizationPolicy of the
          # OTel lane (every port but 4317 and 4318 from the data plane, enforced by ztunnel) and the
          # no-sidecar admission policy with its binding (refusing what the injector leaves behind),
          # and nothing of SPIRE.
          plan=$(ZONE_VALUES=deployment/helm/ztd/zones/ionos.yaml scripts/install-zone/install.sh plan)
          echo "$plan"
          got=$(awk '$1 ~ /^[0-9]+\/[0-9]+$/ {print $2}' <<<"$plan" | paste -sd' ')
          [ "$got" = "ztd istio-base istiod istio-cni ztunnel zone-policy" ] \
            || { echo "ambient plan lists: $got" >&2; exit 1; }
          RENDER_DIR="$RUNNER_TEMP/render-ionos" ZONE_VALUES=deployment/helm/ztd/zones/ionos.yaml \
            ZONE_OVERLAY=deployment/helm/ztd/ci/ionos.overlay.yaml scripts/install-zone/install.sh render
          python3 - "$RUNNER_TEMP/render-ionos" <<'PY'
          import os, sys, yaml
          d = sys.argv[1]
          def docs(name):
              return [x for x in yaml.safe_load_all(open(os.path.join(d, name + ".yaml"))) if x]
          if sorted(os.listdir(d)) != sorted(f + ".yaml" for f in
                  ["ztd", "istio-base", "istiod", "istio-cni", "ztunnel", "zone-policy"]):
              sys.exit(f"ambient render: releases {sorted(os.listdir(d))}")
          istiod = open(os.path.join(d, "istiod.yaml")).read()
          # Istio's own sidecar template mounts an emptyDir at workload-spiffe-uds; the SPIRE
          # socket is the csi.spiffe.io volume of the zones' `spire` injection template.
          for word in ("csi.spiffe.io", "spire"):
              if word in istiod:
                  sys.exit(f"ambient render: istiod names {word!r}")
          cm = [x for x in docs("istiod") if x["kind"] == "ConfigMap" and x["metadata"]["name"] == "istio"][0]
          mesh = yaml.safe_load(cm["data"]["mesh"])
          if mesh.get("trustDomain") != "ionos.trust.invalid":
              sys.exit(f"ambient render: trustDomain {mesh.get('trustDomain')!r}")
          if (mesh.get("meshMTLS") or {}).get("minProtocolVersion") != "TLSV1_3":
              sys.exit("ambient render: meshMTLS.minProtocolVersion is not TLSV1_3 (ADR 005)")
          if "trustDomainAliases" in mesh:
              sys.exit("ambient render: a trust-domain alias is set")
          cni_cm = [x for x in docs("istio-cni") if x["kind"] == "ConfigMap"][0]
          if cni_cm["data"].get("AMBIENT_ENABLED") != "true":
              sys.exit("ambient render: istio-cni has ambient off")
          for rel in ("istio-cni", "ztunnel"):
              ds = [x for x in docs(rel) if x["kind"] == "DaemonSet"]
              if len(ds) != 1:
                  sys.exit(f"ambient render: {rel} renders {len(ds)} DaemonSets")
              spec = ds[0]["spec"]["template"]["spec"]
              if spec.get("priorityClassName") != "system-node-critical":
                  sys.exit(f"ambient render: {rel} priorityClassName {spec.get('priorityClassName')!r}")
              for c in spec.get("containers", []) + spec.get("initContainers", []):
                  if "@sha256:" not in c["image"]:
                      sys.exit(f"ambient render: {rel} image {c['image']} not by digest")
          for dep in [x for x in docs("istiod") if x["kind"] == "Deployment"]:
              for c in dep["spec"]["template"]["spec"]["containers"]:
                  if "@sha256:" not in c["image"]:
                      sys.exit(f"ambient render: istiod image {c['image']} not by digest")
          zp = docs("zone-policy")
          kinds = sorted(x["kind"] for x in zp)
          if kinds != ["AuthorizationPolicy", "PeerAuthentication", "ValidatingAdmissionPolicy", "ValidatingAdmissionPolicyBinding"]:
              sys.exit(f"ambient render: zone-policy renders {kinds}")
          if [x for x in zp if x["kind"] == "PeerAuthentication"][0]["spec"]["mtls"]["mode"] != "STRICT":
              sys.exit("ambient render: the PeerAuthentication is not STRICT")
          ap = [x for x in zp if x["kind"] == "AuthorizationPolicy"][0]
          if (ap["metadata"]["namespace"], ap["spec"].get("action"), ap["spec"]["selector"]["matchLabels"],
                  ap["spec"]["rules"]) != ("ztd-mgmt", "DENY", {"app.kubernetes.io/name": "otel-collector"},
                  [{"from": [{"source": {"namespaces": ["ztd-data"]}}], "to": [{"operation": {"notPorts": ["4317", "4318"]}}]}]):
              sys.exit(f"ambient render: lane-port policy {ap['metadata']['name']} is {ap['spec']}")
          # no-sidecar-in-planes refuses what the injector leaves behind, whatever asked for the
          # injection (a pod label istio.io/rev, a namespace label), and spares ztunnel's own
          # istio-proxy container in the mesh root namespace. In a namespace enrolled in the ambient
          # mesh it also refuses the opt-out, the inbound-capture bypass, the host network, and the
          # other controls of the Pod Security Standards baseline (privileged containers, hostPID,
          # hostIPC, hostPath volumes, an added capability outside baseline's list, seccomp and AppArmor
          # Unconfined, procMount, hostProcess, SELinux, unsafe sysctls, a host in a probe or a hook),
          # on every write path of a pod; each of those rules holds only in an enrolled namespace, so
          # istio-system (not enrolled) is untouched. The kind job checks how they behave.
          vap = [x for x in zp if x["kind"] == "ValidatingAdmissionPolicy"][0]
          exprs = " ".join(v["expression"] for v in vap["spec"]["validations"])
          if vap["spec"]["matchConstraints"]["resourceRules"][0]["resources"] != ["pods", "pods/status", "pods/ephemeralcontainers"]:
              sys.exit(f"ambient render: no-sidecar-in-planes matches {vap['spec']['matchConstraints']['resourceRules'][0]['resources']}")
          gate = "!(has(namespaceObject.metadata.labels) && 'istio.io/dataplane-mode' in namespaceObject.metadata.labels && namespaceObject.metadata.labels['istio.io/dataplane-mode'] == 'ambient') ||"
          enrolled = [v for v in vap["spec"]["validations"] if "enrolled in the ambient mesh" in v["message"]]
          if len(enrolled) != 14 or any(not v["expression"].startswith(gate) for v in enrolled):
              sys.exit(f"ambient render: {len(enrolled)} enrolled-namespace rules, or one without the namespace gate")
          for word in ("inject.istio.io/templates", "sidecar.istio.io/inject", "sidecar.istio.io/status",
                       "'istio-init'", "'istio-validation'", "'istio-proxy'", 'request.namespace == "istio-system"',
                       "namespaceObject.metadata.labels['istio.io/dataplane-mode'] == 'ambient'",
                       "object.metadata.labels['istio.io/dataplane-mode'] != 'ambient'",
                       "ambient.istio.io/bypass-inbound-capture", "object.spec.hostNetwork", "p.hostPort",
                       "c.securityContext.privileged", "object.spec.hostPID", "object.spec.hostIPC", "has(v.hostPath)",
                       "c.securityContext.capabilities.add.exists(a, !(a.upperAscii() in ['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD', 'NET_BIND_SERVICE', 'SETFCAP', 'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT', 'CAP_AUDIT_WRITE', 'CAP_CHOWN', 'CAP_DAC_OVERRIDE', 'CAP_FOWNER', 'CAP_FSETID', 'CAP_KILL', 'CAP_MKNOD', 'CAP_NET_BIND_SERVICE', 'CAP_SETFCAP', 'CAP_SETGID', 'CAP_SETPCAP', 'CAP_SETUID', 'CAP_SYS_CHROOT']))",
                       "seccompProfile.type in ['RuntimeDefault', 'Localhost']", "appArmorProfile.type in ['RuntimeDefault', 'Localhost']",
                       "k.startsWith('container.apparmor.security.beta.kubernetes.io/')", "c.securityContext.procMount != 'Default'",
                       "windowsOptions.hostProcess", "seLinuxOptions.user != ''", "sysctls.exists(s, !(s.name in",
                       "c.readinessProbe.httpGet.host != ''", "c.lifecycle.preStop.tcpSocket.host != ''",
                       "object.spec.ephemeralContainers.exists(c, c.name == 'istio-proxy')"):
              if word not in exprs:
                  sys.exit(f"ambient render: no-sidecar-in-planes does not check {word}")
          if "spire" in open(os.path.join(d, "zone-policy.yaml")).read().lower():
              sys.exit("ambient render: zone-policy names SPIRE")
          if any(x["kind"].startswith("Cilium") for x in docs("ztd")):
              sys.exit("ambient render: the umbrella renders a Cilium object")
          print("ambient render: six releases, istiod's CA in ionos.trust.invalid, ztunnel and istio-cni by digest at system-node-critical, STRICT, lane ports, no sidecar")
          PY
          # The lane-port policies refuse to render a matrix whose DENY policies would hold another
          # lane to the wrong ports, or ports istiod cannot take; each refusal must name its cause.
          lanes() { # lanes <allowMatrix JSON> <refusal text>
            if helm template zone-policy deployment/helm/zone-policy -n istio-system \
                --set spire.enabled=false --set trustDomain=ci.trust.invalid \
                --set-json "lanePorts={\"namespaces\":{\"management\":\"ztd-mgmt\",\"data\":\"ztd-data\"},\"allowMatrix\":$1}" \
                >/dev/null 2>"$RUNNER_TEMP/lanes.err"; then
              echo "zone-policy rendered the lanes $1" >&2; exit 1
            fi
            cat "$RUNNER_TEMP/lanes.err"
            grep -qF "$2" "$RUNNER_TEMP/lanes.err" || { echo "the refusal does not say: $2" >&2; exit 1; }
          }
          otel='"plane":"management","podSelector":{"app":"otel"}'
          lanes "[{\"name\":\"a\",\"from\":{\"plane\":\"data\",\"podSelector\":{\"x\":\"a\"}},\"to\":{$otel,\"ports\":[{\"port\":4317}]}},{\"name\":\"b\",\"from\":{\"plane\":\"data\",\"podSelector\":{\"x\":\"b\"}},\"to\":{$otel}}]" "only some name ports"
          lanes "[{\"name\":\"c\",\"from\":{\"plane\":\"data\"},\"to\":{\"plane\":\"management\",\"podSelector\":{},\"ports\":[{\"port\":9000}]}}]" "no destination podSelector"
          lanes "[{\"name\":\"a\",\"from\":{\"plane\":\"data\",\"podSelector\":{\"x\":\"a\"}},\"to\":{$otel,\"ports\":[{\"port\":4317}]}},{\"name\":\"c\",\"from\":{\"plane\":\"data\",\"podSelector\":{\"x\":\"c\"}},\"to\":{$otel,\"ports\":[{\"port\":4318}]}}]" "different source podSelectors"
          lanes "[{\"name\":\"a\",\"from\":{\"plane\":\"data\"},\"to\":{$otel,\"ports\":[{\"port\":4317}]}},{\"name\":\"d\",\"from\":{\"plane\":\"data\"},\"to\":{\"plane\":\"management\",\"podSelector\":{\"tier\":\"x\"}}}]" "overlaps"
          lanes "[{\"name\":\"a\",\"from\":{\"plane\":\"data\"},\"to\":{$otel,\"ports\":[{\"port\":\"otlp\"}]}}]" "not a number"
          lanes "[{\"name\":\"a\",\"from\":{\"plane\":\"data\"},\"to\":{$otel,\"ports\":[{\"port\":4317,\"endPort\":4320}]}}]" "port range"
          # zone-policy pins the injected proxy's image and status port; a copy of the tree whose
          # zone-policy image or status port differs from istiod's must be refused before anything
          # renders, and the refusal must name the value that differs.
          for field in statusPort proxyImage; do
            copy="$RUNNER_TEMP/coupling-$field"
            mkdir -p "$copy/scripts" "$copy/deployment/helm"
            cp -r scripts/install-zone "$copy/scripts/"
            cp -r deployment/helm/values deployment/helm/zone-policy deployment/helm/ztd "$copy/deployment/helm/"
            case $field in
              statusPort) sed -i 's/^  statusPort: 15020$/  statusPort: 15021/' "$copy/deployment/helm/zone-policy/values.yaml" ;;
              proxyImage) sed -i 's|^  proxyImage: .*$|  proxyImage: docker.io/istio/proxyv2:1.31.0|' "$copy/deployment/helm/zone-policy/values.yaml" ;;
            esac
            ! cmp -s "$copy/deployment/helm/zone-policy/values.yaml" deployment/helm/zone-policy/values.yaml \
              || { echo "the test did not change zone-policy proxySocketPolicy.$field" >&2; exit 1; }
            if RENDER_DIR="$copy/out" "$copy/scripts/install-zone/install.sh" render istiod 2>"$copy.err"; then
              echo "install-zone rendered istiod with a zone-policy $field other than istiod's" >&2; exit 1
            fi
            cat "$copy.err"
            grep -q "proxySocketPolicy.$field" "$copy.err" || { echo "the refusal does not name proxySocketPolicy.$field" >&2; exit 1; }
            [ ! -e "$copy/out/istiod.yaml" ] || { echo "install-zone rendered istiod before refusing the $field mismatch" >&2; exit 1; }
          done

      # The upstream-state checker against local stand-ins that answer 404, 500 and the wrong
      # document: an error page must count as unreachable, never as the document. Its record goes
      # to a temporary directory; CI never writes the evidence under docs/evidences/.
      - name: Test the upstream-state checker's failure paths
        env:
          ALLOW_CI: "1"
        run: |
          scripts/mesh-mode/check-upstream-state-test.sh
          changed=$(git status --porcelain docs/evidences/mesh-mode-upstream-state)
          [ -z "$changed" ] || { echo "the checker's test changed the evidence: $changed" >&2; exit 1; }

  # The release set of charts. release.yml builds and signs the candidate images and creates no
  # release; this job delivers the charts when one is published, and only once every gate of this
  # workflow has passed - a gate job added above is added to needs here. The lifecycle jobs are
  # among them: they may be skipped (BDD_CLUSTER_ENABLED off) but never failed or cancelled, which
  # the default condition cannot express, so the results are checked one by one. The chart gate of
  # release.yml (TDR-BDD-11) runs on candidate branches, not on the published release, so this job
  # runs it again on a disposable cluster of its own: the script lints, renders and server dry-runs
  # every chart first, refuses to package when one fails, and checks each package the same way at
  # the release version, so a chart that fails lint or the dry-run is never released. The chart
  # version is the release tag without its leading v, so the release and every chart in it carry
  # one version. The packages and their checksums are attached to the release; once the client's
  # registry exists and CHART_REGISTRY names it, they are also pushed as OCI chart artefacts, and
  # the digest each push prints is what a zone file pins (oci://...@sha256:).
  release-charts:
    name: Release charts
    needs:
      [tests, lint, images, admission-interop, gator, admission-kind, admission-gitops, contracts, bdd,
       charts, bdd-cluster, bdd-cluster-report]
    if: >-
      ${{ !cancelled() && github.event_name == 'release'
      && needs.tests.result == 'success'
      && needs.lint.result == 'success'
      && needs.images.result == 'success'
      && needs.admission-interop.result == 'success'
      && needs.gator.result == 'success'
      && needs.admission-kind.result == 'success'
      && needs.admission-gitops.result == 'success'
      && needs.contracts.result == 'success'
      && needs.bdd.result == 'success'
      && needs.charts.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.bdd-cluster.result)
      && contains(fromJSON('["success", "skipped"]'), needs.bdd-cluster-report.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # attaches the packaged charts to the release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0

      # The same disposable cluster as release.yml's chart gate, with the CRDs the charts render
      # against, so every package passes the server dry-run before it is attached.
      - name: Install the pinned tools
        run: |
          scripts/tools/install.sh "$RUNNER_TEMP/bin" kind kubectl gatekeeper-chart cilium-crds istio-crds argocd-chart
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create the gate cluster with the CRDs the charts render against
        run: |
          . scripts/tools/pins.env
          kind create cluster --name ztd-gate --image "$KIND_NODE_IMAGE" --wait 180s
          tar -xzf "$RUNNER_TEMP/bin/gatekeeper-${GATEKEEPER_CHART_VERSION}.tgz" -C "$RUNNER_TEMP" gatekeeper/crds
          kubectl apply -f "$RUNNER_TEMP/gatekeeper/crds/provider-customresourcedefinition.yaml" -f "$RUNNER_TEMP/bin/cilium-crds/"
          kubectl apply --server-side -f "$RUNNER_TEMP/bin/istio-crds/"
          kubectl wait --for condition=established --timeout=60s -f "$RUNNER_TEMP/bin/istio-crds/"
          helm template argocd "$RUNNER_TEMP/bin/argo-cd-${ARGOCD_CHART_VERSION}.tgz" \
            --show-only templates/crds/crd-application.yaml --show-only templates/crds/crd-appproject.yaml | kubectl apply -f -
          kubectl wait --for condition=established --timeout=60s crd/providers.externaldata.gatekeeper.sh \
            crd/ciliumclusterwidenetworkpolicies.cilium.io crd/ciliumnetworkpolicies.cilium.io \
            crd/applications.argoproj.io crd/appprojects.argoproj.io

      - name: Check and package the release charts
        run: scripts/ci/check-charts.sh --server-dry-run --package dist/charts --version "${GITHUB_REF_NAME#v}"

      - name: Attach the charts to the release
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/charts/* --clobber
          {
            echo "### Charts released at ${GITHUB_REF_NAME#v}"
            echo '```'
            cat dist/charts/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the charts to the registry
        if: vars.CHART_REGISTRY != ''
        env:
          CHART_REGISTRY: ${{ vars.CHART_REGISTRY }}
          CHART_REGISTRY_USER: ${{ secrets.CHART_REGISTRY_USER }}
          CHART_REGISTRY_PASSWORD: ${{ secrets.CHART_REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$CHART_REGISTRY_PASSWORD" |
            helm registry login "${CHART_REGISTRY%%/*}" --username "$CHART_REGISTRY_USER" --password-stdin
          echo "### Charts pushed to oci://$CHART_REGISTRY" >> "$GITHUB_STEP_SUMMARY"
          for chart in dist/charts/*.tgz; do
            # helm push prints the digest; it goes to the summary so a zone file can pin it.
            pushed=$(helm push "$chart" "oci://$CHART_REGISTRY" 2>&1)
            echo "$pushed"
            echo "$pushed" >> "$GITHUB_STEP_SUMMARY"
          done

  # The deployment-lifecycle scenarios (TDR-BDD-01..04) against each client target. They run
  # automatically on main, on every release and on demand - never on pull requests - one run at a
  # time per target, with the read-only observer identity; ORCE does the deploying.
  #
  # Off until a target has ORCE and the BDD pool installed: it runs only once the
  # repository variable BDD_CLUSTER_ENABLED is "true" and the target's secrets and variable are set
  # (see docs/bdd.md).
  bdd-cluster:
    name: Lifecycle scenarios on ${{ matrix.target }}
    if: vars.BDD_CLUSTER_ENABLED == 'true' && github.event_name != 'pull_request'
    needs: [bdd]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ionos
            key: IONOS
    concurrency:
      group: bdd-cluster-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0

      - name: Install the JavaScript runner
        run: npm ci

      - name: Write the observer kubeconfig
        env:
          OBSERVER_KUBECONFIG: ${{ secrets[format('BDD_{0}_OBSERVER_KUBECONFIG', matrix.key)] }}
        run: |
          umask 077
          printf '%s' "$OBSERVER_KUBECONFIG" > "$RUNNER_TEMP/observer.kubeconfig"

      - name: Run the lifecycle scenarios
        env:
          KUBECONFIG: ${{ runner.temp }}/observer.kubeconfig
          BDD_TARGET: ${{ matrix.target }}
          BDD_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          BDD_ORCE_URL: ${{ secrets[format('BDD_{0}_ORCE_URL', matrix.key)] }}
          BDD_ORCE_ADMIN_TOKEN: ${{ secrets[format('BDD_{0}_ORCE_READ_TOKEN', matrix.key)] }}
          BDD_ORCE_HTTP_USER: ${{ secrets[format('BDD_{0}_ORCE_HTTP_USER', matrix.key)] }}
          BDD_ORCE_HTTP_PASS: ${{ secrets[format('BDD_{0}_ORCE_HTTP_PASS', matrix.key)] }}
          BDD_ORCE_LOGS_CMD: ${{ vars[format('BDD_{0}_ORCE_LOGS_CMD', matrix.key)] }}
        run: npm run bdd:cluster

      # The admission proof (ZT-72) with the namespaced tester identity, against the signed fixtures the
      # admission-fixtures workflow published. Where the target has neither, the row is listed as not
      # run (dry run), so it is never missing from the sheet and never reported as passed.
      - name: Write the admission tester kubeconfig and fixture list
        id: admission
        env:
          TESTER_KUBECONFIG: ${{ secrets[format('BDD_{0}_ADM_TESTER_KUBECONFIG', matrix.key)] }}
          FIXTURES: ${{ vars[format('BDD_{0}_ADM_FIXTURES', matrix.key)] }}
        run: |
          if [ -z "$TESTER_KUBECONFIG" ] || [ -z "$FIXTURES" ]; then
            echo "No admission tester or fixtures for this target - the admission proof does not run here."
            exit 0
          fi
          umask 077
          printf '%s' "$TESTER_KUBECONFIG" > "$RUNNER_TEMP/tester.kubeconfig"
          printf '%s\n' "$FIXTURES" > "$RUNNER_TEMP/fixtures.txt"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Run the admission proof
        if: always()
        env:
          KUBECONFIG: ${{ runner.temp }}/tester.kubeconfig
          BDD_ADM_FIXTURES: ${{ runner.temp }}/fixtures.txt
          BDD_TARGET: ${{ matrix.target }}
          BDD_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          MODE: ${{ steps.admission.outputs.configured == 'true' && 'cluster' || 'cluster-dryrun' }}
        run: BDD_MODE="$MODE" GODOG_CUCUMBER_OUT=bundles/bdd/go-cluster-report-${{ matrix.target }}.json go test ./internal/bdd -godog.tags=@ZT-72

      # The chart gate (TDR-BDD-11) and the secrets baseline (TDR-BDD-08) run on a disposable cluster in
      # release.yml, which decides them; here they are listed as not run, never as passed.
      - name: List the release-workflow rows
        if: always()
        run: BDD_MODE=cluster-dryrun GODOG_CUCUMBER_OUT=bundles/bdd/go-cluster-report-${{ matrix.target }}-release-rows.json go test ./internal/bdd -godog.tags=@TDR-BDD-08,@TDR-BDD-11

      - name: Run the repository scenarios
        if: always()
        run: |
          GODOG_CUCUMBER_OUT=bundles/bdd/go-report.json go test ./internal/bdd
          npm run bdd
          BDD_MODE=catalogue GODOG_CUCUMBER_OUT=bundles/bdd/go-catalogue-report.json go test ./internal/bdd
          npm run bdd:catalogue

      - name: Generate the traceability sheet for this target
        if: always()
        run: |
          go run ./cmd/bddreport --rows features/annex-rows.txt --out bundles/bdd \
            bundles/bdd/go-report.json bundles/bdd/js-report.json \
            bundles/bdd/go-catalogue-report.json bundles/bdd/js-catalogue-report.json \
            bundles/bdd/js-cluster-report-*.json bundles/bdd/go-cluster-report-*.json
          cat bundles/bdd/traceability.md >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/bddpack -evidence bundles/bdd/evidence -catalogue bundles/bdd/bdd-catalogue.md

      - name: Publish the evidence bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bdd-evidence-${{ matrix.target }}
          path: bundles/bdd

  # One sheet across every target: a row is proven only when it passed on all of them.
  bdd-cluster-report:
    name: Lifecycle traceability across targets
    if: always() && vars.BDD_CLUSTER_ENABLED == 'true' && github.event_name != 'pull_request'
    needs: [bdd-cluster]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Collect every target's evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bdd-evidence-*
          path: evidence

      - name: Generate the cross-target sheet
        run: |
          go run ./cmd/bddreport --require-complete --rows features/annex-rows.txt --out bundles/bdd \
            evidence/*/go-report.json evidence/*/js-report.json \
            evidence/*/go-catalogue-report.json evidence/*/js-catalogue-report.json \
            evidence/*/js-cluster-report-*.json evidence/*/go-cluster-report-*.json
          cat bundles/bdd/traceability.md >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/bddpack -evidence evidence -catalogue bundles/bdd/bdd-catalogue.md

      - name: Publish the cross-target sheet
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bdd-traceability
          path: bundles/bdd

  # Reachability of every client cluster from the pipeline: the API server answers and the
  # identity authenticates. Read-only identity, never on pull requests; a target whose kubeconfig secret
  # is not set yet is reported as skipped, not as reachable.
  cluster-reachability:
    name: Reachability of ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ionos
            key: IONOS
          - target: zone-a
            key: ZONE_A
          - target: zone-b
            key: ZONE_B
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the cluster answers
        env:
          OBSERVER_KUBECONFIG: ${{ secrets[format('BDD_{0}_OBSERVER_KUBECONFIG', matrix.key)] }}
        run: |
          if [ -z "$OBSERVER_KUBECONFIG" ]; then
            echo "::notice::No observer kubeconfig for ${{ matrix.target }} - reachability not checked."
            exit 0
          fi
          scripts/tools/install.sh "$RUNNER_TEMP/bin" kubectl
          umask 077
          printf '%s' "$OBSERVER_KUBECONFIG" > "$RUNNER_TEMP/observer.kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/observer.kubeconfig"
          "$RUNNER_TEMP/bin/kubectl" version --request-timeout=20s
          "$RUNNER_TEMP/bin/kubectl" auth whoami --request-timeout=20s
          echo "${{ matrix.target }}: reachable from GitHub Actions" >> "$GITHUB_STEP_SUMMARY"
