name: CI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Go tests
    uses: eclipse-xfsc/dev-ops/.github/workflows/go-test.yml@main
    # The shared workflow defaults to Go 1.24 and cannot read go.mod; keep this
    # in step with the go directive there.
    with:
      go-version: '1.27'

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # golangci-lint refuses a module whose go directive is newer than the Go it
      # was built with, which a published container image cannot follow. Building
      # the pinned version with the toolchain go.mod names keeps the two in step.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.13.2
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  images:
    name: Image build and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build, assert Linux and scan every image
        run: |
          shopt -s nullglob
          dockerfiles=(deployment/docker/*/Dockerfile)
          if [ ${#dockerfiles[@]} -eq 0 ]; then
            echo 'No container build context yet - nothing to build.'
            exit 0
          fi
          for dockerfile in "${dockerfiles[@]}"; do
            # The context is the repository root, so an image can take scripts/, ui/ and
            # flows/; .dockerignore keeps local state such as .dev/ out of it.
            image="ci/$(basename "$(dirname "$dockerfile")"):${{ github.sha }}"

            docker build --platform linux/amd64 -f "$dockerfile" -t "$image" .

            # ZT-13 requires Linux images; assert it rather than trust the Dockerfile.
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            echo "$image platform: $platform"
            if [ "$platform" != "linux/amd64" ]; then
              echo "::error::$image is $platform, ZT-13 requires linux/amd64"
              exit 1
            fi

            # A time-boxed, documented exception may exclude named upstream paths from the gate;
            # an expired exception fails the build. Everything else stays under the gate.
            skips=()
            exception="$(dirname "$dockerfile")/scan-exception.json"
            if [ -f "$exception" ]; then
              expires=$(jq -r '.expires' "$exception")
              if [[ "$(date -u +%F)" > "$expires" ]]; then
                echo "::error::$exception expired on $expires - renew it or remove the upstream findings"
                exit 1
              fi
              mapfile -t skips < <(jq -r '(.skipDirs[] | "--skip-dirs", .), (.skipFiles[] | "--skip-files", .)' "$exception")
              {
                echo "### Scan exception for $image (expires $expires)"
                jq -r '.reason, "", .tracking, "", "Excluded: " + ((.skipDirs + .skipFiles) | join(", "))' "$exception"
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0 image --exit-code 1 --severity HIGH,CRITICAL "${skips[@]}" "$image"
          done

  # The signing profile end to end: the release signing script signs and attests throwaway images
  # with the pinned cosign and an ephemeral key, in a registry:2 on the runner, and the admission
  # provider verifies them. No secret and no external push.
  admission-interop:
    name: Admission provider interop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Start a local registry and install the pinned cosign
        run: |
          . scripts/tools/pins.env
          docker run -d --name registry -p 127.0.0.1:5000:5000 "$REGISTRY_IMAGE"
          scripts/tools/install.sh "$RUNNER_TEMP/bin" cosign

      - name: Sign, attest and verify through the provider
        run: go test -count=1 -run Interop -v ./services/admission-provider/
        env:
          FACIS_INTEROP_REGISTRY: localhost:5000
          COSIGN: ${{ runner.temp }}/bin/cosign

  # The constraints that need nothing but the object (digest-only, allowed repositories, naming, the
  # namespace scope), tested offline with the pinned gator.
  gator:
    name: Admission constraints (gator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the pinned gator
        run: scripts/tools/install.sh "$RUNNER_TEMP/bin" gator

      - name: Verify the constraint suite
        run: '"$RUNNER_TEMP/bin/gator" verify -v deployment/admission'

      - name: Test the enforcement check
        run: scripts/admission/enforced_test.sh

  # The whole admission catalogue in a real Gatekeeper: a kind cluster with Gatekeeper (pinned chart,
  # cache off), the provider and a local registry of test images signed with the release script and
  # an ephemeral key. Includes provider-down, Gatekeeper-down and trust-removal cases.
  admission-kind:
    name: Admission catalogue (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0

      - name: Install the pinned tools
        run: scripts/tools/install.sh "$RUNNER_TEMP/bin" kind kubectl cosign syft gatekeeper-chart

      - name: Run the admission catalogue
        run: BIN="$RUNNER_TEMP/bin" scripts/admission/kind-e2e.sh

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install the JavaScript tooling
        run: npm ci

      # Schemas compile, valid fixtures pass and invalid ones fail, reason codes are registered,
      # OpenAPI documents are valid OpenAPI 3.1 with resolvable references.
      - name: Validate the interface contracts
        run: npm run contracts

  bdd:
    name: BDD suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install the JavaScript runner
        run: npm ci

      - name: Test the ORCE Builder nodes
        run: node --test ui/nodes/*/test/*.test.mjs

      # Every scenario is the Annex wording, every row has one, and the generated files are current.
      - name: Check the pack against Annex A
        run: go run ./cmd/bddpack -check

      # Strict: the implemented, non-cluster scenarios. A pending or undefined step fails.
      - name: Run the Go scenarios
        run: GODOG_CUCUMBER_OUT=bundles/bdd/go-report.json go test ./internal/bdd

      - name: Run the JavaScript scenarios
        run: npm run bdd

      # The rows not implemented yet, reported as not run rather than as gaps.
      - name: Run the pending catalogue
        run: |
          BDD_MODE=catalogue GODOG_CUCUMBER_OUT=bundles/bdd/go-catalogue-report.json go test ./internal/bdd
          npm run bdd:catalogue

      # The cluster rows cannot run here; a dry run lists them as not run. Only this job's sheet
      # merges it: the cluster jobs never do, so it cannot stand in for a real cluster run.
      - name: List the cluster scenarios
        run: |
          npm run bdd:cluster-dryrun
          BDD_MODE=cluster-dryrun GODOG_CUCUMBER_OUT=bundles/bdd/go-cluster-dryrun.json go test ./internal/bdd

      - name: Merge the reports and generate the traceability sheet
        if: always()
        run: |
          go run ./cmd/bddreport --require-complete --rows features/annex-rows.txt --out bundles/bdd \
            bundles/bdd/go-report.json bundles/bdd/js-report.json \
            bundles/bdd/go-catalogue-report.json bundles/bdd/js-catalogue-report.json \
            bundles/bdd/js-cluster-dryrun.json bundles/bdd/go-cluster-dryrun.json
          cat bundles/bdd/traceability.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bdd-evidence
          path: bundles/bdd

  # The observability proof end to end on kind (scripts/verify-observability/verify.sh): a kind
  # cluster with Cilium, the kind zone, cert-manager, the demonstrator role in the same cluster, the
  # zone's telemetry releases and the proof's echo image; then every check of the proof, alerts with
  # their measured detection times included. The record is published as an artefact.
  observability-kind:
    name: Observability proof (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0

      - name: Install the pinned tools
        run: |
          scripts/tools/install.sh "$RUNNER_TEMP/bin" kind kubectl cilium-cli
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml

      - name: Create the kind cluster with Cilium and cert-manager
        run: |
          scripts/dev/kind-cilium-up.sh
          scripts/dev/kind-cert-manager-up.sh

      - name: Install the kind zone without its telemetry releases
        run: scripts/install-zone/install.sh install ztd spire-crds spire istio-base istiod istio-cni zone-policy ztd-openbao

      - name: Install the demonstrator role and copy the zone's client certificate
        env:
          ZONE_VALUES: deployment/helm/ztd/ci/demonstrator-values.yaml
          TELEMETRY_ZONES: kind=kind-ztd
        run: scripts/install-zone/install.sh install

      - name: Install the zone's telemetry releases
        run: scripts/install-zone/install.sh install otel-node otel-gateway

      - name: Build the proof's echo image into kind
        run: |
          docker build --platform linux/amd64 -f deployment/docker/trace-echo/Dockerfile -t ztd-proof/trace-echo:dev .
          kind load docker-image ztd-proof/trace-echo:dev --name ztd

      - name: Run the observability proof
        env:
          ZTD_EVIDENCE_DIR: ${{ runner.temp }}/verify-observability
        run: scripts/verify-observability/verify.sh

      - name: Publish the record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-observability-kind
          path: ${{ runner.temp }}/verify-observability
          if-no-files-found: ignore

  charts:
    name: Chart lint and render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          # One pinned Helm for QA and for the lifecycle workflow; its flags differ by major version.
          version: v4.3.0

      # The fixture chart under features/ is linted like a release chart: the TDR's lint and
      # dry-run rule applies to every chart the pipeline installs. A chart whose values have no
      # defaults ships its valid baseline in ci/values.yaml. The same script is the release gate,
      # where it adds a server dry-run against a disposable cluster (release.yml, TDR-BDD-11), and
      # packages the charts when a release is published (release-charts below), so the gate a pull
      # request clears is the gate the release is held to. The umbrella is also rendered with every
      # shipped zone file under deployment/helm/ztd/zones/ (the example excepted), so a zone file
      # that stops rendering is caught here rather than by an operator on the cluster. Rendering only.
      - name: Lint and render every chart
        run: |
          scripts/ci/check-charts.sh
          for zone in deployment/helm/ztd/zones/*.yaml; do
            [ "$(basename "$zone")" = zone-a.example.yaml ] && continue
            echo "render deployment/helm/ztd with $zone"
            helm lint deployment/helm/ztd -f "$zone"
            helm template deployment/helm/ztd -f "$zone" >/dev/null
          done

      # What the release relies on, against charts the test writes: a set that passes is packaged
      # at the version with matching checksums, and one failing chart leaves no package at all.
      - name: Test the chart check
        run: scripts/ci/check-charts_test.sh

      # A zone is eight releases (scripts/install-zone/install.sh): three project charts linted above
      # (the umbrella, zone-policy and ztd-openbao, the last wrapping the upstream openbao chart from
      # its Chart.lock) and five upstream charts, SPIRE's and Istio's, pinned by version and digest in
      # the installer. Each upstream release is rendered from its pinned chart with its values file
      # under deployment/helm/values/ and the kind zone's facts, and ztd-openbao through the installer
      # with the zone facts it reads from the umbrella's defaults and the zone file: its server
      # StatefulSet and both of its jobs must carry the identity label the registration rule selects,
      # unpinned on kind and pinned (the placeholder node, no cluster) with zone A's file. Rendering
      # only: CI never installs.
      # The rendered istiod mesh configuration must carry the TLS 1.3 minimum of the security
      # baseline (ADR 005), and the installer must refuse a revisioned or an ambient zone before it
      # renders anything (it installs the default, unrevisioned istiod in sidecar mode only), and a
      # zone-policy whose proxy image or status port differs from istiod's before it renders anything.
      - name: Render the upstream releases of a zone
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
          RENDER_DIR="$RUNNER_TEMP/render" \
            scripts/install-zone/install.sh render spire-crds spire istio-base istiod istio-cni ztd-openbao
          RENDER_DIR="$RUNNER_TEMP/render-zone-a" ZONE_VALUES=deployment/helm/ztd/zones/zone-a.yaml \
            scripts/install-zone/install.sh render ztd-openbao
          python3 - "$RUNNER_TEMP/render/ztd-openbao.yaml" "$RUNNER_TEMP/render-zone-a/ztd-openbao.yaml" <<'PY'
          import sys, yaml
          def pods(path):
              docs = [d for d in yaml.safe_load_all(open(path)) if d]
              found = {}
              for d in docs:
                  kind, name = d.get("kind"), d["metadata"]["name"]
                  if kind == "StatefulSet" and name == "ztd-openbao": found["server"] = d
                  elif kind == "Job" and name.startswith("ztd-openbao-bootstrap-"): found["bootstrap"] = d
                  elif kind == "Job" and name == "ztd-verify-openbao": found["verification"] = d
              missing = {"server", "bootstrap", "verification"} - set(found)
              if missing: sys.exit(f"ztd-openbao render {path}: no {', '.join(sorted(missing))}")
              return {k: v["spec"]["template"] for k, v in found.items()}
          def node_pin(t):
              terms = (((t["spec"].get("affinity") or {}).get("nodeAffinity") or {})
                       .get("requiredDuringSchedulingIgnoredDuringExecution") or {}).get("nodeSelectorTerms") or []
              return [v for term in terms for e in term.get("matchExpressions") or []
                      if e.get("key") == "kubernetes.io/hostname" for v in e.get("values") or []]
          accounts = {"server": "ztd-openbao", "bootstrap": "ztd-openbao-bootstrap", "verification": "ztd-verify-openbao"}
          for zone, path, want in (("kind", sys.argv[1], []), ("zone-a", sys.argv[2], ["istiod-node-not-found"])):
              for name, t in pods(path).items():
                  label = (t["metadata"].get("labels") or {}).get("spiffe.io/spire-managed-identity")
                  if label != "true":
                      sys.exit(f"ztd-openbao render ({zone}): the {name} pod template lacks spiffe.io/spire-managed-identity: \"true\"")
                  if node_pin(t) != want:
                      sys.exit(f"ztd-openbao render ({zone}): the {name} pod template's node pin is {node_pin(t)}, not {want}")
                  # Each pod its own ServiceAccount, so each its own SPIFFE ID (none on "default").
                  sa = t["spec"].get("serviceAccountName") or "default"
                  if sa != accounts[name]:
                      sys.exit(f"ztd-openbao render ({zone}): the {name} pod runs as ServiceAccount {sa}, not {accounts[name]}")
              print(f"ztd-openbao render ({zone}): the server and both jobs carry the identity label, each with its own ServiceAccount; node pin {want or 'none'}")
          PY
          python3 - "$RUNNER_TEMP/render/istiod.yaml" <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          cm = [d for d in docs if d.get("kind") == "ConfigMap" and d["metadata"]["name"] == "istio"]
          mesh = yaml.safe_load(cm[0]["data"]["mesh"]) if cm else {}
          got = ((mesh or {}).get("meshMTLS") or {}).get("minProtocolVersion")
          if got != "TLSV1_3":
              sys.exit(f"istiod render: meshConfig.meshMTLS.minProtocolVersion is {got!r}, not 'TLSV1_3' (ADR 005)")
          print("istiod render: meshConfig.meshMTLS.minProtocolVersion is TLSV1_3")
          PY
          for setting in revision=canary mode=ambient; do
            key=${setting%%=*}
            zone="$RUNNER_TEMP/zone-$key.yaml"
            out="$RUNNER_TEMP/refused-$key"
            mkdir -p "$out"
            python3 - deployment/helm/ztd/ci/values.yaml "$key" "${setting#*=}" "$zone" <<'PY'
          import sys, yaml
          source, key, value, target = sys.argv[1:]
          zone = yaml.safe_load(open(source))
          zone.setdefault("mesh", {})[key] = value
          yaml.safe_dump(zone, open(target, "w"), sort_keys=False)
          PY
            if ZONE_VALUES="$zone" RENDER_DIR="$out" \
                scripts/install-zone/install.sh render 2>"$out.err"; then
              echo "install-zone rendered a zone with mesh.$key set to ${setting#*=}" >&2; exit 1
            fi
            cat "$out.err"
            grep -q "mesh\.$key" "$out.err" || { echo "the refusal does not name mesh.$key" >&2; exit 1; }
            [ -z "$(ls -A "$out")" ] || { echo "install-zone rendered into $out before refusing" >&2; exit 1; }
          done
          # zone-policy pins the injected proxy's image and status port; a copy of the tree whose
          # zone-policy image or status port differs from istiod's must be refused before anything
          # renders, and the refusal must name the value that differs.
          for field in statusPort proxyImage; do
            copy="$RUNNER_TEMP/coupling-$field"
            mkdir -p "$copy/scripts" "$copy/deployment/helm"
            cp -r scripts/install-zone scripts/tools "$copy/scripts/"
            cp -r deployment/helm/values deployment/helm/zone-policy deployment/helm/ztd "$copy/deployment/helm/"
            case $field in
              statusPort) sed -i 's/^  statusPort: 15020$/  statusPort: 15021/' "$copy/deployment/helm/zone-policy/values.yaml" ;;
              proxyImage) sed -i 's|^  proxyImage: .*$|  proxyImage: docker.io/istio/proxyv2:1.31.0|' "$copy/deployment/helm/zone-policy/values.yaml" ;;
            esac
            ! cmp -s "$copy/deployment/helm/zone-policy/values.yaml" deployment/helm/zone-policy/values.yaml \
              || { echo "the test did not change zone-policy proxySocketPolicy.$field" >&2; exit 1; }
            if RENDER_DIR="$copy/out" "$copy/scripts/install-zone/install.sh" render istiod 2>"$copy.err"; then
              echo "install-zone rendered istiod with a zone-policy $field other than istiod's" >&2; exit 1
            fi
            cat "$copy.err"
            grep -q "proxySocketPolicy.$field" "$copy.err" || { echo "the refusal does not name proxySocketPolicy.$field" >&2; exit 1; }
            [ ! -e "$copy/out/istiod.yaml" ] || { echo "install-zone rendered istiod before refusing the $field mismatch" >&2; exit 1; }
          done

      # The telemetry releases of a zone: the installer refuses, before it renders anything, a
      # participant zone file without the entry or without the revocation status-list URL (zone A's
      # file has neither until the demonstrator role is installed, and its other releases still
      # render), and a demonstrator file on a cluster with a LoadBalancer and no source ranges. The
      # mesh's tracing: istiod renders the OpenTelemetry provider of the zone gateway, and zone-policy
      # the mesh-wide Telemetry resource that enables it, under the same name.
      - name: Render the telemetry releases and their refusals
        run: |
          refuse() { # refuse <expected text> <zone file> [release...]
            local want=$1 zone=$2 out; shift 2
            out=$(mktemp -d)
            if ZONE_VALUES="$zone" RENDER_DIR="$out" scripts/install-zone/install.sh render "$@" 2>"$out.err"; then
              echo "install-zone rendered $zone ($*) without $want" >&2; exit 1
            fi
            cat "$out.err"
            grep -qF "$want" "$out.err" || { echo "the refusal does not name $want" >&2; exit 1; }
            [ -z "$(ls -A "$out")" ] || { echo "install-zone rendered into $out before refusing" >&2; exit 1; }
          }
          refuse telemetryExport.entry.address deployment/helm/ztd/zones/zone-a.yaml otel-gateway
          python3 - deployment/helm/ztd/ci/values.yaml "$RUNNER_TEMP/no-url.yaml" <<'PY'
          import sys, yaml
          zone = yaml.safe_load(open(sys.argv[1]))
          zone["telemetryExport"]["revocationStatusListUrl"] = ""
          yaml.safe_dump(zone, open(sys.argv[2], "w"))
          PY
          refuse telemetryExport.revocationStatusListUrl "$RUNNER_TEMP/no-url.yaml"
          refuse observabilityBackends.entry.sourceRanges deployment/helm/ztd/zones/ionos.yaml
          ZONE_VALUES=deployment/helm/ztd/zones/zone-a.yaml scripts/install-zone/install.sh render ztd-openbao >/dev/null
          RENDER_DIR="$RUNNER_TEMP/render-tracing" scripts/install-zone/install.sh render istiod zone-policy otel-node otel-gateway >/dev/null
          python3 - "$RUNNER_TEMP/render-tracing" <<'PY'
          import sys, yaml
          d = sys.argv[1]
          docs = lambda f: [x for x in yaml.safe_load_all(open(f"{d}/{f}.yaml")) if x]
          mesh = yaml.safe_load(next(x for x in docs("istiod") if x["kind"] == "ConfigMap" and x["metadata"]["name"] == "istio")["data"]["mesh"])
          providers = {p["name"]: p for p in mesh.get("extensionProviders") or []}
          tel = [x for x in docs("zone-policy") if x["kind"] == "Telemetry"]
          if len(tel) != 1: sys.exit("zone-policy render: no mesh-wide Telemetry resource")
          name = tel[0]["spec"]["tracing"][0]["providers"][0]["name"]
          p = providers.get(name, {}).get("opentelemetry") or {}
          if p.get("service") != "otel-gateway.ztd-mgmt.svc.cluster.local" or p.get("port") != 4317:
              sys.exit(f"istiod render: no OpenTelemetry provider {name!r} at the zone gateway on 4317: {providers}")
          gw = [x for x in docs("otel-gateway") if x["kind"] == "Deployment"][0]["spec"]["template"]["metadata"]["labels"]
          if gw.get("app.kubernetes.io/name") != "otel-collector" or gw.get("spiffe.io/spire-managed-identity") != "true":
              sys.exit(f"otel-gateway render: the pod lacks the allow-matrix label or the identity label: {gw}")
          node = [x for x in docs("otel-node") if x["kind"] == "DaemonSet"][0]["spec"]["template"]["spec"]
          paths = [v["hostPath"]["path"] for v in node["volumes"] if "hostPath" in v]
          if not node.get("hostNetwork") or paths != ["/var/log/pods"]:
              sys.exit(f"otel-node render: host network {node.get('hostNetwork')}, host paths {paths}")
          print(f"tracing provider {name} at the zone gateway; gateway labelled; node collectors on the host network with /var/log/pods only")
          PY

      # The observability releases: every rendered image pinned by digest and under an accepted
      # licence, no Grafana or Loki; the alert rules under promtool against fixture series, and the
      # rendered intervals equal to the detection budget the documentation states (below 30 s).
      - name: Check the observability releases' images, alert rules and detection budget
        run: |
          scripts/verify-observability/check-rendered-images.sh
          scripts/verify-observability/test-alert-rules.sh

      # The upstream-state checker against local stand-ins that answer 404, 500 and the wrong
      # document: an error page must count as unreachable, never as the document. Its record goes
      # to a temporary directory; CI never writes the evidence under docs/evidences/.
      - name: Test the upstream-state checker's failure paths
        env:
          ALLOW_CI: "1"
        run: |
          scripts/mesh-mode/check-upstream-state-test.sh
          changed=$(git status --porcelain docs/evidences/mesh-mode-upstream-state)
          [ -z "$changed" ] || { echo "the checker's test changed the evidence: $changed" >&2; exit 1; }

  # The release set of charts. release.yml builds and signs the candidate images and creates no
  # release; this job delivers the charts when one is published, and only once every gate of this
  # workflow has passed - a gate job added above is added to needs here. The lifecycle jobs are
  # among them: they may be skipped (BDD_CLUSTER_ENABLED off) but never failed or cancelled, which
  # the default condition cannot express, so the results are checked one by one. The chart gate of
  # release.yml (TDR-BDD-11) runs on candidate branches, not on the published release, so this job
  # runs it again on a disposable cluster of its own: the script lints, renders and server dry-runs
  # every chart first, refuses to package when one fails, and checks each package the same way at
  # the release version, so a chart that fails lint or the dry-run is never released. The chart
  # version is the release tag without its leading v, so the release and every chart in it carry
  # one version. The packages and their checksums are attached to the release; once the client's
  # registry exists and CHART_REGISTRY names it, they are also pushed as OCI chart artefacts, and
  # the digest each push prints is what a zone file pins (oci://...@sha256:).
  release-charts:
    name: Release charts
    needs:
      [tests, lint, images, admission-interop, gator, admission-kind, contracts, bdd, charts,
       bdd-cluster, bdd-cluster-report]
    if: >-
      ${{ !cancelled() && github.event_name == 'release'
      && needs.tests.result == 'success'
      && needs.lint.result == 'success'
      && needs.images.result == 'success'
      && needs.admission-interop.result == 'success'
      && needs.gator.result == 'success'
      && needs.admission-kind.result == 'success'
      && needs.contracts.result == 'success'
      && needs.bdd.result == 'success'
      && needs.charts.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.bdd-cluster.result)
      && contains(fromJSON('["success", "skipped"]'), needs.bdd-cluster-report.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # attaches the packaged charts to the release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0

      # The same disposable cluster as release.yml's chart gate, with the CRDs the charts render
      # against, so every package passes the server dry-run before it is attached.
      - name: Install the pinned tools
        run: |
          scripts/tools/install.sh "$RUNNER_TEMP/bin" kind kubectl gatekeeper-chart cilium-crds
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create the gate cluster with the CRDs the charts render against
        run: |
          . scripts/tools/pins.env
          kind create cluster --name ztd-gate --image "$KIND_NODE_IMAGE" --wait 180s
          tar -xzf "$RUNNER_TEMP/bin/gatekeeper-${GATEKEEPER_CHART_VERSION}.tgz" -C "$RUNNER_TEMP" gatekeeper/crds
          kubectl apply -f "$RUNNER_TEMP/gatekeeper/crds/provider-customresourcedefinition.yaml" -f "$RUNNER_TEMP/bin/cilium-crds/"
          kubectl wait --for condition=established --timeout=60s crd/providers.externaldata.gatekeeper.sh \
            crd/ciliumclusterwidenetworkpolicies.cilium.io crd/ciliumnetworkpolicies.cilium.io

      - name: Check and package the release charts
        run: scripts/ci/check-charts.sh --server-dry-run --package dist/charts --version "${GITHUB_REF_NAME#v}"

      - name: Attach the charts to the release
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/charts/* --clobber
          {
            echo "### Charts released at ${GITHUB_REF_NAME#v}"
            echo '```'
            cat dist/charts/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the charts to the registry
        if: vars.CHART_REGISTRY != ''
        env:
          CHART_REGISTRY: ${{ vars.CHART_REGISTRY }}
          CHART_REGISTRY_USER: ${{ secrets.CHART_REGISTRY_USER }}
          CHART_REGISTRY_PASSWORD: ${{ secrets.CHART_REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$CHART_REGISTRY_PASSWORD" |
            helm registry login "${CHART_REGISTRY%%/*}" --username "$CHART_REGISTRY_USER" --password-stdin
          echo "### Charts pushed to oci://$CHART_REGISTRY" >> "$GITHUB_STEP_SUMMARY"
          for chart in dist/charts/*.tgz; do
            # helm push prints the digest; it goes to the summary so a zone file can pin it.
            pushed=$(helm push "$chart" "oci://$CHART_REGISTRY" 2>&1)
            echo "$pushed"
            echo "$pushed" >> "$GITHUB_STEP_SUMMARY"
          done

  # The deployment-lifecycle scenarios (TDR-BDD-01..04) against each client target. They run
  # automatically on main, on every release and on demand - never on pull requests - one run at a
  # time per target, with the read-only observer identity; ORCE does the deploying.
  #
  # Off until a target has ORCE and the BDD pool installed: it runs only once the
  # repository variable BDD_CLUSTER_ENABLED is "true" and the target's secrets and variable are set
  # (see docs/bdd.md).
  bdd-cluster:
    name: Lifecycle scenarios on ${{ matrix.target }}
    if: vars.BDD_CLUSTER_ENABLED == 'true' && github.event_name != 'pull_request'
    needs: [bdd]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ionos
            key: IONOS
    concurrency:
      group: bdd-cluster-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0

      - name: Install the JavaScript runner
        run: npm ci

      - name: Write the observer kubeconfig
        env:
          OBSERVER_KUBECONFIG: ${{ secrets[format('BDD_{0}_OBSERVER_KUBECONFIG', matrix.key)] }}
        run: |
          umask 077
          printf '%s' "$OBSERVER_KUBECONFIG" > "$RUNNER_TEMP/observer.kubeconfig"

      - name: Run the lifecycle scenarios
        env:
          KUBECONFIG: ${{ runner.temp }}/observer.kubeconfig
          BDD_TARGET: ${{ matrix.target }}
          BDD_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          BDD_ORCE_URL: ${{ secrets[format('BDD_{0}_ORCE_URL', matrix.key)] }}
          BDD_ORCE_ADMIN_TOKEN: ${{ secrets[format('BDD_{0}_ORCE_READ_TOKEN', matrix.key)] }}
          BDD_ORCE_HTTP_USER: ${{ secrets[format('BDD_{0}_ORCE_HTTP_USER', matrix.key)] }}
          BDD_ORCE_HTTP_PASS: ${{ secrets[format('BDD_{0}_ORCE_HTTP_PASS', matrix.key)] }}
          BDD_ORCE_LOGS_CMD: ${{ vars[format('BDD_{0}_ORCE_LOGS_CMD', matrix.key)] }}
        run: npm run bdd:cluster

      # The admission proof (ZT-72) with the namespaced tester identity, against the signed fixtures the
      # admission-fixtures workflow published. Where the target has neither, the row is listed as not
      # run (dry run), so it is never missing from the sheet and never reported as passed.
      - name: Write the admission tester kubeconfig and fixture list
        id: admission
        env:
          TESTER_KUBECONFIG: ${{ secrets[format('BDD_{0}_ADM_TESTER_KUBECONFIG', matrix.key)] }}
          FIXTURES: ${{ vars[format('BDD_{0}_ADM_FIXTURES', matrix.key)] }}
        run: |
          if [ -z "$TESTER_KUBECONFIG" ] || [ -z "$FIXTURES" ]; then
            echo "No admission tester or fixtures for this target - the admission proof does not run here."
            exit 0
          fi
          umask 077
          printf '%s' "$TESTER_KUBECONFIG" > "$RUNNER_TEMP/tester.kubeconfig"
          printf '%s\n' "$FIXTURES" > "$RUNNER_TEMP/fixtures.txt"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Run the admission proof
        if: always()
        env:
          KUBECONFIG: ${{ runner.temp }}/tester.kubeconfig
          BDD_ADM_FIXTURES: ${{ runner.temp }}/fixtures.txt
          BDD_TARGET: ${{ matrix.target }}
          BDD_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          MODE: ${{ steps.admission.outputs.configured == 'true' && 'cluster' || 'cluster-dryrun' }}
        run: BDD_MODE="$MODE" GODOG_CUCUMBER_OUT=bundles/bdd/go-cluster-report-${{ matrix.target }}.json go test ./internal/bdd -godog.tags=@ZT-72

      # The chart gate (TDR-BDD-11) and the secrets baseline (TDR-BDD-08) run on a disposable cluster in
      # release.yml, which decides them; here they are listed as not run, never as passed.
      - name: List the release-workflow rows
        if: always()
        run: BDD_MODE=cluster-dryrun GODOG_CUCUMBER_OUT=bundles/bdd/go-cluster-report-${{ matrix.target }}-release-rows.json go test ./internal/bdd -godog.tags=@TDR-BDD-08,@TDR-BDD-11

      - name: Run the repository scenarios
        if: always()
        run: |
          GODOG_CUCUMBER_OUT=bundles/bdd/go-report.json go test ./internal/bdd
          npm run bdd
          BDD_MODE=catalogue GODOG_CUCUMBER_OUT=bundles/bdd/go-catalogue-report.json go test ./internal/bdd
          npm run bdd:catalogue

      - name: Generate the traceability sheet for this target
        if: always()
        run: |
          go run ./cmd/bddreport --rows features/annex-rows.txt --out bundles/bdd \
            bundles/bdd/go-report.json bundles/bdd/js-report.json \
            bundles/bdd/go-catalogue-report.json bundles/bdd/js-catalogue-report.json \
            bundles/bdd/js-cluster-report-*.json bundles/bdd/go-cluster-report-*.json
          cat bundles/bdd/traceability.md >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/bddpack -evidence bundles/bdd/evidence -catalogue bundles/bdd/bdd-catalogue.md

      - name: Publish the evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bdd-evidence-${{ matrix.target }}
          path: bundles/bdd

  # One sheet across every target: a row is proven only when it passed on all of them.
  bdd-cluster-report:
    name: Lifecycle traceability across targets
    if: always() && vars.BDD_CLUSTER_ENABLED == 'true' && github.event_name != 'pull_request'
    needs: [bdd-cluster]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Collect every target's evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bdd-evidence-*
          path: evidence

      - name: Generate the cross-target sheet
        run: |
          go run ./cmd/bddreport --require-complete --rows features/annex-rows.txt --out bundles/bdd \
            evidence/*/go-report.json evidence/*/js-report.json \
            evidence/*/go-catalogue-report.json evidence/*/js-catalogue-report.json \
            evidence/*/js-cluster-report-*.json evidence/*/go-cluster-report-*.json
          cat bundles/bdd/traceability.md >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/bddpack -evidence evidence -catalogue bundles/bdd/bdd-catalogue.md

      - name: Publish the cross-target sheet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bdd-traceability
          path: bundles/bdd
