name: Eclipse Dash licence scan (Go)

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '0 0 1 * *'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The scanner reads the root go.sum and fails on a file that is not there, so the
  # scan waits until the Go module exists.
  detect-go-module:
    runs-on: ubuntu-latest
    outputs:
      scannable: ${{ steps.go-sum.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Look for a Go module to scan
        id: go-sum
        run: |
          if [ -f go.sum ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo 'No go.sum in the repository - nothing for the licence gate to scan.' >> "$GITHUB_STEP_SUMMARY"
          fi

  # The scan runs here rather than through the shared org workflow. That workflow
  # sets up a fixed Go version to list the modules, and an older Go refuses to read
  # a module whose go directive is newer - yet the list it builds is never used:
  # the Eclipse Dash tool reads go.sum directly, so no Go toolchain is needed at all.
  #
  # With the organisation's review token the tool also files IP review requests for
  # anything it cannot clear. A pull request from a fork cannot see that secret, so
  # there it runs check-only: no review requests, but a restricted licence still fails.
  licence-scan:
    needs: detect-go-module
    if: needs.detect-go-module.outputs.scannable == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The maven redirect service answers 404 and hands back an HTML error page,
      # which only surfaces later as "invalid or corrupt jarfile". The artefact is
      # fetched from the repository directly, at a pinned version, and checked to be
      # an archive before it is run.
      - name: Download the Eclipse Dash licence tool
        env:
          DASH_VERSION: 1.1.0
        run: |
          curl -fsSL -o dash-licenses.jar \
            "https://repo.eclipse.org/content/repositories/dash-licenses-releases/org/eclipse/dash/org.eclipse.dash.licenses/${DASH_VERSION}/org.eclipse.dash.licenses-${DASH_VERSION}.jar"
          unzip -t dash-licenses.jar > /dev/null

      # The tool exits 127 on an internal error - typically the licence services
      # being unreachable - and otherwise with the number of dependencies needing
      # review. Both fail the gate, because neither verified the dependencies,
      # but they ask for opposite things from whoever reads the failure.
      - name: Scan the Go dependencies
        env:
          REVIEW_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
          FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          args=()
          if [ -n "$REVIEW_TOKEN" ]; then
            args=(-review -project technology.xfsc -repo "$REPOSITORY_URL" -token "$REVIEW_TOKEN")
          elif [ "$FROM_FORK" = 'true' ]; then
            echo 'Pull request from a fork: check-only scan, no IP review requests are filed.'
          else
            echo '::error::the review token is not available to this run, so IP review requests cannot be filed'
            exit 1
          fi

          set +e
          java -jar dash-licenses.jar go.sum "${args[@]}"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 127 ]; then
            echo '::error::the licence service could not be reached, so the dependencies were not verified - rerun this job'
            exit 1
          fi
          echo "::error::$status dependencies need licence review before this can merge"
          exit 1

  # This job is the stable name branch protection requires. It is green only when a
  # scan actually ran, or when there is nothing to scan yet.
  licence-gate:
    name: Licence gate
    needs: [detect-go-module, licence-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report the scan result
        run: |
          scan='${{ needs.licence-scan.result }}'
          echo "Eclipse Dash scan: $scan"

          if [ '${{ needs.detect-go-module.outputs.scannable }}' != 'true' ]; then
            exit 0
          fi

          # Anything but success while there is something to scan would be a green
          # check that proves nothing. Fail instead of reporting false assurance.
          if [ "$scan" != 'success' ]; then
            echo '::error::a Go module exists but the licence scan did not succeed'
            exit 1
          fi
