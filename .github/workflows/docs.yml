name: Publish documentation

# Requires GitHub Pages enabled with its source set to the gh-pages branch, folder / or /docs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ghp-import pushes the built site to gh-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install mkdocs

      - name: Build and publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The site is published at the branch root and again under docs/, so Pages
          # serves it whether its source folder is / or /docs.
          mkdocs build
          mkdocs build --site-dir site/docs
          touch site/docs/.nojekyll
          ghp-import --no-jekyll --push --force site
