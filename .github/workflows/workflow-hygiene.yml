name: Workflow hygiene

# Unfiltered by path so it can be a required status check without leaving unrelated
# pull requests waiting for a run that never starts.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Workflow hygiene # the job name is what branch protection requires
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check action pinning and token scopes
        run: scripts/check-workflow-hygiene.sh
