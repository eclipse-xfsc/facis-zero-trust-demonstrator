name: Signing environment audit

# ZT-10: the record that the release environment refuses a run from a ref outside its allowlist (main,
# candidate/*, v* - docs/ci-cd.md). Started by hand only, once the environment's allowlist is applied;
# until then it does nothing. The audit job creates a disposable branch at this commit (or uses the
# probe_ref given), dispatches this workflow on it in probe mode, waits for that run and requires its
# probe job to have been refused by the environment before any step ran (scripts/supplychain/env-audit.sh).
# The probe job names the release environment and nothing else: no secret, no key, no checkout.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: audit (start here) or probe (started by the audit)
        type: choice
        options: [audit, probe]
        default: audit
      probe_ref:
        description: a branch outside the allowlist to probe from; empty creates and deletes a disposable one
        type: string
        default: ''

permissions:
  contents: read

jobs:
  probe:
    name: Environment probe
    if: inputs.mode == 'probe'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Record that the environment admitted this ref
        run: echo "::error::the release environment admitted $GITHUB_REF"

  audit:
    name: Environment audit
    if: inputs.mode != 'probe'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates and deletes the disposable probe branch
      actions: write # dispatches the probe run and reads its jobs
      checks: read # reads the probe job's annotations, where GitHub states the refusal
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe the release environment from a forbidden ref
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_REF: ${{ inputs.probe_ref }}
        run: scripts/supplychain/env-audit.sh bundles/env-audit

      - name: Keep the audit record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-environment-audit
          path: bundles/env-audit
