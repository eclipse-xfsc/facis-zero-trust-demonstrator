image: {repository: ghcr.io/eclipse-xfsc/facis-zero-trust-demonstrator/feed-bridge, digest: ""}
trustDomain: ""
# The only identity admitted to the feed (GET /snapshot, /events, /v2/...): the UI's service account.
ui: {namespace: "", serviceAccount: ""}
# Identities admitted to POST /ingest: the producers or the component that forwards their lines.
producers: []   # [{namespace: ztd-data, serviceAccount: ztd-guard}]
budgetBytes: 33554432
podAnnotations: {sidecar.istio.io/nativeSidecar: "true"}
networkPolicy:
  istiod: {enabled: true, namespace: istio-system}
resources:
  requests: {cpu: 20m, memory: 48Mi}
  limits: {memory: 160Mi}
