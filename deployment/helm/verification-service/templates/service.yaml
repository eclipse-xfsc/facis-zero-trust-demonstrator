# The service's address inside the zone; only the API port is published.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "verification-service.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "verification-service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "verification-service.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
