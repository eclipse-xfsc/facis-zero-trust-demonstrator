{{- if .Values.serviceAccount.create }}
# The service's identity: spiffe://<trust domain>/ns/<namespace>/sa/<serviceAccount.name>, from the
# mesh, never from the account's token, which no pod mounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "verification-service.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
