# Example only. Copy to zone-a.yaml and replace every value with what the cluster baseline recorded.
zone:
  name: zone-a
  kubernetesVersion: v1.35.0   # `kubectl version -o json | jq -r .serverVersion.gitVersion`; 1.33 or later where the mesh runs (native sidecars, ADR-0009)
  storageClass: csi-default    # `kubectl get storageclass`
  loadBalancer:
    type: cloud                # cloud | metallb | none
  # The zone's SPIFFE trust domain: the DNS zone delegated to this trust zone, in which the trust
  # framework publishes its records (not read off the cluster; the Technical Design Authority
  # confirms it). Required where the mesh runs; fixed at the first SPIRE install.
  trustDomain: zone-a.example
mesh:
  mode: sidecar                # the mesh decision of ADR-0009; ambient is the parked alternative
cni:
  cilium:
    enabled: true              # `kubectl -n kube-system get ds cilium`; another CNI needs a declared derogation
planes:
  extra:                       # the control planes: management plane, no mesh label
    - { name: spire-system, plane: management, mesh: false }
    - { name: istio-system, plane: management, mesh: false }
networkPolicy:
  kubeApi:
    enabled: true              # required where the mesh runs: SPIRE and istiod call the API
    cidrs: ["10.0.0.1/32"]     # `kubectl get endpointslices -n default -l kubernetes.io/service-name=kubernetes`; used only without Cilium
    ports: [443]               # the port in that endpoint slice (the API server's, not the Service's)
  meshControlPlane:
    enabled: true
  controlPlaneWebhooks:
    enabled: true
  identityServer:
    enabled: true
