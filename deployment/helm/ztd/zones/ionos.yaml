# IONOS Cloud cluster, the demonstrator cluster (CI/CD and visualization, ADR-0005). Recorded
# 2026-09-23 from the live cluster with the kubeconfig the client provided, re-read 2026-09-26 and
# 2026-11-14. Facts, not choices: change them only when the cluster changes.
#
# The mesh here is Istio in ambient mode on the provider's Calico, without SPIRE (ADR-0018):
# scripts/install-zone/install.sh installs it on its ambient path (the umbrella, istio-base, istiod
# with its own CA, istio-cni, ztunnel and the STRICT PeerAuthentication; no SPIRE, no OpenBao), and
# scripts/verify-ambient-mesh/verify.sh proves it. The API endpoint addresses are kept out of the
# repository: networkPolicy.kubeApi.cidrs is empty here, so this file does not render on its own.
# The operator installs from a local, uncommitted copy that holds the two addresses; CI renders it
# with deployment/helm/ztd/ci/ionos.overlay.yaml (documentation-range addresses).
zone:
  name: ionos
  kubernetesVersion: v1.35.6      # kubectl version, server, 2026-09-23; unchanged 2026-09-26 and 2026-11-14
  storageClass: ionos-cloud-essential   # the default of four ionos.cloud.com classes
  loadBalancer:
    type: cloud                   # IONOS provisions Services of type LoadBalancer; not yet exercised here
  # INTERIM, as the zones' interim names: istiod's mesh trust domain (meshConfig.trustDomain), used
  # by the identities istiod's CA issues here. Not federated with the zones' trust domains and with
  # no alias; replaced when the final trust domains are decided (istiod then reissues every
  # workload certificate). .invalid can never resolve or be delegated.
  trustDomain: ionos.trust.invalid

# Istio ambient mode, one ztunnel per node (ADR-0018). Upstream ambient mode does not support SPIRE,
# so istiod's CA issues the identities; ZT-24 is declared not met on this cluster
# (docs/specifications.md).
mesh:
  mode: ambient

# The CNI is Calico v3.30.7, managed by IONOS (iptables dataplane on nft, IPIP, WireGuard, MTU 1440;
# CNI in /opt/cni/bin and /etc/cni/net.d), not Cilium, and cannot be replaced: the Cilium-only
# pieces stay off, and the Istio CNI agent chains behind Calico. The declared derogation lets the
# ambient mesh render without Cilium, its openings as Kubernetes NetworkPolicies (ADR-0018).
cni:
  cilium:
    enabled: false
  derogation: calico-ambient

# The mesh's control plane: a management-plane namespace under the default deny, without the mesh
# label (ztunnel and istiod are never enrolled). No spire-system: no SPIRE here.
planes:
  extra:
    - { name: istio-system, plane: management, mesh: false }

networkPolicy:
  # CoreDNS here is labelled k8s-app=coredns, not kube-dns; with the chart default the DNS bypass
  # would select nothing and every plane namespace would lose name resolution.
  dns:
    namespace: kube-system
    podSelector:
      k8s-app: coredns
  # The API lane, by address (no Cilium): the managed control plane's two endpoints behind the
  # kubernetes Service (443 -> 15700). The addresses are recorded at stand-up and kept out of the
  # repository: they go into the local copy this cluster is installed from. Calico enforces egress
  # after kube-proxy's DNAT, so the endpoint port alone is opened.
  kubeApi:
    enabled: true
    cidrs: []
    ports: [15700]
  # ztunnel -> istiod on xDS (15012).
  meshControlPlane:
    enabled: true
  # The managed API server reaches the pods through the provider's konnectivity-agent DaemonSet
  # (kube-system, on the pod network), so a webhook call is expected from those pods: inferred from
  # the cluster's layout. The proof's webhook check passed on 2026-11-15 with this opening in place
  # (the only one onto istiod's 15017 from outside istio-system). Only istiod's webhook: no SPIRE.
  controlPlaneWebhooks:
    enabled: true
    fromPods:
      - namespace: kube-system
        podSelector:
          k8s-app: konnectivity-agent
    targets:
      - name: istiod
        namespace: istio-system
        podSelector:
          app: istiod
        port: 15017
