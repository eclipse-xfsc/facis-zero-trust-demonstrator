{{- /*
The ZT-55 allow matrix as network policy: for each lane, an egress rule in the source namespace
and an ingress rule in the destination namespace. The mesh layer decides on identity on top: the
zone-policy release renders the same rows (copied by scripts/install-zone) as allow rules by SPIFFE
identity under a mesh-wide default deny. The intraPlanePairs render nothing here (the network
layer is open inside a plane namespace); this template only refuses one whose endpoints are not in
one namespace, as it would then have no network lane.
*/ -}}
{{- range .Values.intraPlanePairs }}
{{- $fromNs := include "ztd.endpointNamespace" (dict "root" $ "endpoint" .from) }}
{{- $toNs := include "ztd.endpointNamespace" (dict "root" $ "endpoint" .to) }}
{{- if ne $fromNs $toNs }}
{{- fail (printf "intraPlanePairs %s: the caller is in %s and the destination in %s; an intra-plane pair joins two endpoints of one plane namespace (a pair across namespaces is an allowMatrix row)" .name $fromNs $toNs) }}
{{- end }}
{{- end }}
{{- range .Values.allowMatrix }}
{{- $fromNs := include "ztd.endpointNamespace" (dict "root" $ "endpoint" .from) }}
{{- $toNs := include "ztd.endpointNamespace" (dict "root" $ "endpoint" .to) }}
{{- $fromSelector := .from.podSelector | default dict }}
{{- $toSelector := .to.podSelector | default dict }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .name }}-egress
  namespace: {{ $fromNs }}
  labels:
    {{- include "ztd.labels" $ | nindent 4 }}
  annotations:
    ztd.facis.io/allow-matrix: {{ .name }}
    ztd.facis.io/enforced-by: {{ .enforcedBy | default "mesh" | quote }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $fromSelector | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $toNs }}
          podSelector:
            matchLabels:
              {{- toYaml $toSelector | nindent 14 }}
      {{- with .to.ports }}
      ports:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .name }}-ingress
  namespace: {{ $toNs }}
  labels:
    {{- include "ztd.labels" $ | nindent 4 }}
  annotations:
    ztd.facis.io/allow-matrix: {{ .name }}
    ztd.facis.io/enforced-by: {{ .enforcedBy | default "mesh" | quote }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $toSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $fromNs }}
          podSelector:
            matchLabels:
              {{- toYaml $fromSelector | nindent 14 }}
      {{- with .to.ports }}
      ports:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
