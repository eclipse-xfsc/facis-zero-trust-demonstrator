{{- /*
The ZT-55 allow matrix as network policy: for each lane, an egress rule in the source namespace
and an ingress rule in the destination namespace. The mesh layer decides on identity on top.
In ambient mode a lane that names ports also names the HBONE port 15008: ztunnel carries the
captured connection to the destination pod on that port, so the application port alone would drop
it (ADR-0018). A lane without ports opens every port already.
*/ -}}
{{- $hbone := eq .Values.mesh.mode "ambient" }}
{{- range .Values.allowMatrix }}
{{- $fromNs := include "ztd.endpointNamespace" (dict "root" $ "endpoint" .from) }}
{{- $toNs := include "ztd.endpointNamespace" (dict "root" $ "endpoint" .to) }}
{{- $fromSelector := .from.podSelector | default dict }}
{{- $toSelector := .to.podSelector | default dict }}
{{- $ports := .to.ports }}
{{- if and $hbone $ports }}{{ $ports = append $ports (dict "port" 15008 "protocol" "TCP") }}{{ end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .name }}-egress
  namespace: {{ $fromNs }}
  labels:
    {{- include "ztd.labels" $ | nindent 4 }}
  annotations:
    ztd.facis.io/allow-matrix: {{ .name }}
    ztd.facis.io/enforced-by: {{ .enforcedBy | default "mesh" | quote }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $fromSelector | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $toNs }}
          podSelector:
            matchLabels:
              {{- toYaml $toSelector | nindent 14 }}
      {{- with $ports }}
      ports:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .name }}-ingress
  namespace: {{ $toNs }}
  labels:
    {{- include "ztd.labels" $ | nindent 4 }}
  annotations:
    ztd.facis.io/allow-matrix: {{ .name }}
    ztd.facis.io/enforced-by: {{ .enforcedBy | default "mesh" | quote }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $toSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $fromNs }}
          podSelector:
            matchLabels:
              {{- toYaml $fromSelector | nindent 14 }}
      {{- with $ports }}
      ports:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
