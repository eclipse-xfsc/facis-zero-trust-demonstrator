{{- include "guard.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ztd-guard-config
  namespace: {{ .Release.Namespace }}
data:
{{- $callers := include "guard.callers" . | fromJsonArray }}
{{- $guard := mergeOverwrite (deepCopy .Values.config) (dict "allowed_callers" $callers "event_source" (printf "guard-%s" .Values.zone)) }}
{{- $guard = mergeOverwrite $guard (include "guard.grpcConfig" . | fromJson) }}
{{- if .Values.tenant.enabled }}{{- $_ := set $guard "target_tenant" .Release.Namespace }}{{- end }}
  config.json: {{ toJson $guard | quote }}
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 127.0.0.1, port_value: 9901}
    static_resources:
      listeners:
        - name: guarded
          address:
            socket_address: {address: 0.0.0.0, port_value: 8080}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: guarded
                    use_remote_address: true
                    # Preserve only the trusted sidecar's XFCC for the local hook. The hook removes it upstream.
                    forward_client_cert_details: ALWAYS_FORWARD_ONLY
                    route_config:
                      name: protected
                      virtual_hosts:
                        - name: protected
                          domains: [{{ (urlParse .Values.config.published_base_url).host | quote }}]
                          routes:
                            - match: {path: /demo}
                              route:
                                cluster: resource
                                timeout: 15s
                                host_rewrite_literal: {{ printf "%s.%s.svc.cluster.local" .Values.resourceName .Release.Namespace | quote }}
                            {{- range .Values.grpc.methods }}
                            # A gRPC method: the exact path, and only with a gRPC content type.
                            - match: {path: {{ . | quote }}, grpc: {}}
                              route:
                                cluster: resource-grpc
                                timeout: 15s
                                host_rewrite_literal: {{ printf "%s.%s.svc.cluster.local" $.Values.resourceName $.Release.Namespace | quote }}
                            {{- end }}
                    http_filters:
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          transport_api_version: V3
                          failure_mode_allow: false
                          status_on_error: {code: ServiceUnavailable}
                          grpc_service:
                            envoy_grpc: {cluster_name: hook}
                            timeout: 9s
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          suppress_envoy_headers: true
      clusters:
        - name: resource
          type: STRICT_DNS
          connect_timeout: 1s
          load_assignment:
            cluster_name: resource
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: {{ .Values.resourceName }}, port_value: {{ .Values.resourcePort }}}
        {{- if .Values.grpc.methods }}
        - name: resource-grpc
          type: STRICT_DNS
          connect_timeout: 1s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: resource-grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: {{ .Values.resourceName }}, port_value: {{ .Values.grpc.resourcePort }}}
        {{- end }}
        - name: hook
          type: STATIC
          connect_timeout: 1s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: hook
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: 127.0.0.1, port_value: 50051}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ztd-policy-config
  namespace: {{ .Release.Namespace }}
data:
{{- $policy := dict "revision" .Values.policyRevision "audience" .Values.config.inbound_audience "host" (urlParse .Values.config.published_base_url).host "guard_callers" (list (printf "spiffe://%s/ns/%s/sa/ztd-guard" .Values.trustDomain .Release.Namespace)) "participant_callers" $callers "scope_tenants" .Values.config.scope_tenants "event_source" (printf "policy-%s" .Values.zone) }}
{{- if .Values.tenant.enabled }}{{- $_ := set $policy "tenant_members" (dict .Release.Namespace (list (first $callers))) }}{{- end }}
{{- with .Values.policyRules.blockedClients }}{{- $_ := set $policy "blocked_clients" . }}{{- end }}
{{- if .Values.policyRules.presentation.scopes }}{{- $_ := set $policy "presentation" (dict "scopes" .Values.policyRules.presentation.scopes "oid4vp_link" .Values.policyRules.presentation.oid4vpLink) }}{{- end }}
{{- if .Values.tsa.evaluationURL }}{{- $_ := set $policy "tsa" (dict "evaluation_url" .Values.tsa.evaluationURL "timeout_ms" (int .Values.tsa.timeoutMS)) }}{{- end }}
{{- $policy = mergeOverwrite $policy (include "guard.grpcConfig" . | fromJson) }}
  config.json: {{ toJson $policy | quote }}
