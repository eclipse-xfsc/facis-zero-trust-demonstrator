{{- include "guard.validate" . -}}
{{- with .Values.metrics.scraper }}{{ if .principal }}
{{- /* The one opening to the guard's ops port: the configured scraper, GET /metrics only. */ -}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ztd-guard-metrics
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: ztd-guard}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: [{{ trimPrefix "spiffe://" .principal | quote }}]
      to:
        - operation:
            ports: ["9090"]
            methods: ["GET"]
            paths: ["/metrics"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ztd-guard-metrics
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ztd-guard}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .namespace | quote }}}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: 9090}]
---
apiVersion: v1
kind: Service
metadata:
  name: ztd-guard-metrics
  namespace: {{ $.Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: ztd-guard}
  # Scraped whatever the guard's readiness: a guard reported down must still be read.
  publishNotReadyAddresses: true
  ports: [{name: http-metrics, port: 9090, targetPort: 9090}]
{{- end }}{{ end }}
