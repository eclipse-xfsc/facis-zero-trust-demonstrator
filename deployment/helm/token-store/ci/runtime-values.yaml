# Render-only fixture, layered over ci/values.yaml. No credential values.
runtime:
  enabled: true
  existingConfigMap: ztd-token-store-acquisition
  credentialsSecret: ztd-token-store-credentials
  replayCallers:
    - spiffe://zone-b.trust.invalid/ns/example/sa/ztd-guard
  callers:
    - {namespace: example, name: ztd-guard}
trustDomain: zone-b.trust.invalid
database:
  mesh:
    selector: {app: postgres}
    callers:
      - {namespace: example, name: ztd-connector}
networkPolicy:
  enabled: true
  schemaEgress:
    - to:
        - podSelector: {matchLabels: {app: postgres}}
      ports: [{port: 5432, protocol: TCP}]
nodeSelector:
  kubernetes.io/hostname: render-only-node
