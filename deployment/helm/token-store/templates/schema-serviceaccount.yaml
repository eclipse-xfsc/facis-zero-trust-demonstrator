{{- if .Values.serviceAccount.create }}
# The migration runner's own identity, distinct from the service's: it holds the schema's DDL,
# which the service never does. A hook, because the Jobs that run as it are hooks and Helm creates
# hooks before the release's own resources; one weight below the Jobs, so it exists when they
# start; kept across uninstall, as hook resources are, like the Secret the Jobs read.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.schemaName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "token-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: {{ sub (int .Values.schema.hookWeight) 1 | quote }}
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
{{- end }}
