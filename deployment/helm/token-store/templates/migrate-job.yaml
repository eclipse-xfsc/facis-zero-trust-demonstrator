{{- include "token-store.validate" . -}}
# Applies the schema before the release's resources are created or updated. The migrations are
# embedded in the image, so the schema applied is the one the deployed build expects; a run on a
# database that is already current changes nothing, which is what makes an upgrade a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "token-store.name" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "token-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: {{ .Values.schema.hookWeight | quote }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.schema.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "token-store.labels" . | nindent 8 }}
        app.kubernetes.io/component: schema
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- include "token-store.migrateContainer" (dict "root" . "args" (list "migrate" "up")) | nindent 8 }}
