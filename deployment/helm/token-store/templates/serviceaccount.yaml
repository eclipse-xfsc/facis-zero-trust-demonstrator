{{- if .Values.serviceAccount.create }}
# The store's own identity. Under both mesh modes its SPIFFE ID ends in this account's name,
# spiffe://<trust domain>/ns/<namespace>/sa/<serviceAccount.name>; the SVID comes from the mesh,
# not from the account's token, which no pod mounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "token-store.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
