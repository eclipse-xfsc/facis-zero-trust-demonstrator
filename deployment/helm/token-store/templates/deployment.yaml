{{- include "token-store.validate" . -}}
# The service. A regular resource, never a hook: the schema Job has run before its first pod
# starts, and readiness is the pod's own answer, 200 only while PostgreSQL is reachable with the
# schema current and the key-value store is initialised and unsealed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "token-store.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "token-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "token-store.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "token-store.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
        {{- if .Values.identity.spireManagedIdentity }}
        spiffe.io/spire-managed-identity: "true"
        {{- end }}
      {{- include "token-store.annotations" . | nindent 6 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The service's worst case: the drain delay, the shutdown timeout, a readiness evaluation
      # that still holds a connection when the pool closes, and a margin.
      terminationGracePeriodSeconds: {{ add (int .Values.server.drainDelaySeconds) (int .Values.server.shutdownTimeoutSeconds) (int .Values.server.readinessTimeoutSeconds) 5 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          args:
            - serve
            - --readiness-timeout={{ int .Values.server.readinessTimeoutSeconds }}s
            - --drain-delay={{ int .Values.server.drainDelaySeconds }}s
            - --shutdown-timeout={{ int .Values.server.shutdownTimeoutSeconds }}s
            - --log-level={{ .Values.server.logLevel }}
          env:
            - name: TOKEN_STORE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.secretKey | quote }}
            - name: TOKEN_STORE_OPENBAO_URL
              value: {{ .Values.openbao.address | quote }}
            {{- if .Values.runtime.enabled }}
            - name: TOKEN_STORE_ACQUIRE_CONFIG
              value: {{ printf "/etc/token-store/%s" .Values.runtime.configKey | quote }}
            {{- if eq .Values.openbao.auth.method "kubernetes" }}
            - name: TOKEN_STORE_OPENBAO_AUTH_ROLE
              value: {{ .Values.openbao.auth.role | quote }}
            - name: TOKEN_STORE_OPENBAO_AUTH_MOUNT
              value: {{ .Values.openbao.auth.mount | quote }}
            - name: TOKEN_STORE_OPENBAO_JWT_FILE
              value: /var/run/secrets/openbao/token
            {{- else }}
            - name: TOKEN_STORE_OPENBAO_TOKEN_FILE
              value: {{ printf "/var/run/token-store/credentials/%s" .Values.runtime.openbaoTokenKey | quote }}
            {{- end }}
            - name: TOKEN_STORE_REPLAY_CALLERS
              value: {{ join "," .Values.runtime.replayCallers | quote }}
            {{- end }}
          {{- if .Values.runtime.enabled }}
          volumeMounts:
            - {name: acquisition, mountPath: /etc/token-store, readOnly: true}
            {{- if or (ne .Values.openbao.auth.method "kubernetes") .Values.runtime.credentialKeys }}
            - {name: credentials, mountPath: /var/run/token-store/credentials, readOnly: true}
            {{- end }}
            {{- if eq .Values.openbao.auth.method "kubernetes" }}
            - {name: openbao-sa-token, mountPath: /var/run/secrets/openbao, readOnly: true}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: ops
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 5
            timeoutSeconds: {{ add (int .Values.server.readinessTimeoutSeconds) 1 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      {{- if .Values.runtime.enabled }}
      volumes:
        - name: acquisition
          configMap:
            name: {{ .Values.runtime.existingConfigMap | quote }}
        {{- if ne .Values.openbao.auth.method "kubernetes" }}
        - name: credentials
          secret:
            secretName: {{ .Values.runtime.credentialsSecret | quote }}
            defaultMode: 0440
        {{- else if .Values.runtime.credentialKeys }}
        # Only the listed keys: the Secret's OpenBao token, if one is left there, is not mounted.
        - name: credentials
          secret:
            secretName: {{ .Values.runtime.credentialsSecret | quote }}
            defaultMode: 0440
            items:
              {{- range .Values.runtime.credentialKeys }}
              - {key: {{ . | quote }}, path: {{ . | quote }}}
              {{- end }}
        {{- end }}
        {{- if eq .Values.openbao.auth.method "kubernetes" }}
        # An audience-bound token for the OpenBao login only: the API server refuses it (wrong
        # audience), and the pod still mounts no API token (automountServiceAccountToken: false).
        - name: openbao-sa-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.openbao.auth.audience | quote }}
                  expirationSeconds: {{ int .Values.openbao.auth.expirationSeconds }}
                  path: token
        {{- end }}
      {{- end }}
