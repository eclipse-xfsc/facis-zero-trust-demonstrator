# The token-store image, by digest only - the chart refuses a tag.
image:
  repository: ghcr.io/eclipse-xfsc/facis-zero-trust-demonstrator/token-store
  digest: ""

# The PostgreSQL the store owns. The chart does not run the database and never carries its
# credential: the connection URL lives in a Secret of the release namespace, created before the
# install, and the migration Jobs and the service read it from there.
database:
  # Required: the Secret holding the connection URL.
  existingSecret: ""
  # The key of the connection URL in that Secret.
  secretKey: url
  # When the database runs in the mesh: its pod labels and port. The chart then renders the allow
  # rule ztd-token-store-database on that port for the store's two accounts (serviceAccount below)
  # and `callers`, each by namespace and service account in trustDomain - the other owner of the
  # schema, the connector. Empty selector: no rule (a database outside the mesh, or one whose rule
  # is declared elsewhere).
  mesh:
    selector: {}   # e.g. {app.kubernetes.io/name: ztd-postgres}
    port: 5432
    callers: []    # - {namespace: ztd-data, name: ztd-connector}

# The zone's key-value store, reached inside the management plane; the mesh carries the traffic
# as mTLS, so the address is plain HTTP. Scheme and host only: the store appends its own paths.
# The service asks it whether it is initialised and unsealed and is not ready until it is, so the
# store at this address must exist: the default is the zone's OpenBao, the release ztd-openbao
# that the zone installer installs last; a zone without it points this at its own.
openbao:
  address: http://ztd-openbao.ztd-mgmt.svc:8200
  # How the service authenticates to OpenBao. token (the default): the token file from the
  # credentials Secret. kubernetes: OpenBao's Kubernetes auth method with a projected service-account
  # token for `audience`, which the kubelet rotates (expirationSeconds, 600 at least) and the service
  # rereads at every login; the service logs in again at half its OpenBao token's lease and before it
  # expires, so no token is held in a Secret and none expires under the service
  # (docs/secrets.md#kubernetes-auth). role names the OpenBao role, which must bind this namespace,
  # the ServiceAccount and the audience.
  auth:
    method: token
    role: ""
    mount: kubernetes
    audience: openbao
    expirationSeconds: 600

# The service.
replicas: 1
# Runtime endpoints and renewal are opt-in; all sensitive files are mounted from an existing Secret.
runtime:
  enabled: false
  existingConfigMap: ""
  configKey: acquisition.json
  credentialsSecret: ""
  openbaoTokenKey: openbao-token   # not used with openbao.auth.method kubernetes
  # With openbao.auth.method kubernetes, the keys of credentialsSecret the routes read (holder
  # credentials, client secrets): only these are mounted, so a static OpenBao token left in the
  # Secret never reaches the pod. With token, the whole Secret is mounted, as before.
  credentialKeys: []
  replayCallers: []
  # The mesh callers of the store's API (AuthorizationPolicy ztd-token-store-callers): the guard, on
  # POST /internal/substitute and /internal/replay-check of port 8080, by namespace and service
  # account in trustDomain. Empty: no rule, and the mesh default deny refuses every caller.
  callers: []      # - {namespace: ztd-data, name: ztd-guard}

# The zone's trust domain: the callers' SPIFFE IDs are spiffe://<trustDomain>/ns/<namespace>/sa/<name>.
trustDomain: ""
podAnnotations: {}
nodeSelector: {}
networkPolicy:
  # Schema hooks need their own database lanes, independent of the server.
  schemaEgress: []
  istiodNamespace: istio-system
  enabled: false
  ingressFrom: []
  egress: []
server:
  # Budget of one /readyz evaluation, both dependencies asked at once. The readiness probe's
  # timeoutSeconds renders as this plus one, so the kubelet never cuts an evaluation short.
  readinessTimeoutSeconds: 2
  # On SIGTERM, how long /readyz answers 503 while the listeners stay open: the time routing needs
  # to leave the pod. 0 closes at once.
  drainDelaySeconds: 5
  # Drain of the listeners after that delay. terminationGracePeriodSeconds renders as the drain
  # delay plus this plus the readiness budget plus five, the service's worst case.
  shutdownTimeoutSeconds: 10
  # debug, info, warn or error.
  logLevel: info

# The store's identities in the mesh: a ServiceAccount for the service and another for the
# migration Jobs, each the last segment of a SPIFFE ID (spiffe://<trust domain>/ns/<namespace>/sa/
# <name>), and the pod label the SPIRE registration selects. The migration runner holds the
# schema's DDL and the service never does, so they are distinct principals; the schema account is
# created as a hook, one weight below the Jobs, since Helm creates hooks before the release's own
# resources, and it is kept across uninstall as hook resources are. With create off both accounts
# are managed outside the chart and must exist. No pod mounts an account's token; the label is
# harmless where SPIRE is absent and required where it runs.
serviceAccount:
  create: true
  name: ztd-token-store
  schemaName: ztd-token-store-schema
identity:
  spireManagedIdentity: true

schema:
  # Revert every migration on uninstall (helm uninstall runs `migrate down --to 0`), leaving an
  # empty schema. Off by default: a production database outlives the release. On in ci/values.yaml.
  dropOnUninstall: false
  # Hook weight of the migration Jobs, inside the platform band (40-59) of the umbrella chart's
  # hook-weight scheme.
  hookWeight: 41
  # The Job's whole run, lock wait included, and how often Kubernetes retries a failed pod.
  timeout: 2m
  backoffLimit: 2

# For the service's container and the migration Jobs alike.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
