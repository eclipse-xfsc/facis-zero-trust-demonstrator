apiVersion: v2
name: token-store
description: >-
  The zone's token store (services/token-store): the authorization database's schema, applied as a
  versioned migration by a hook Job before every install and upgrade, and the service with its
  probes and its identity; the endpoints that hold, renew and substitute upstream tokens follow.
