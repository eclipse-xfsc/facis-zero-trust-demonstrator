# Release `istiod` of the demonstrator cluster (the ambient path, ADR-0018): the mesh control plane in
# ambient mode, with istiod's own CA as the only source of workload certificates (no SPIRE on that
# cluster), installed as the upstream chart ships it. The zones' sidecar release reads istiod.yaml.
#   chart source      Istio 1.31.4 release archive, chart `istiod` 1.31.4
#                     https://github.com/istio/istio/releases/download/1.31.4/istio-1.31.4-linux-amd64.tar.gz
#                     (manifests/charts/istio-control/istio-discovery; the archive's sha256 is
#                     pinned in scripts/install-zone/install.sh as ISTIO_AMBIENT_ARCHIVE_SHA256)
#   namespace         istio-system (created by the umbrella chart, never by this release)
# Pinned in scripts/install-zone/install.sh and docs/dependencies.md. Every value set here is
# listed with its reason in README.md next to this file. Values marked "zone fact" are filled by
# scripts/install-zone from the zone file; the installer refuses to render the release when the
# zone file does not state them.
#
# Nothing here names SPIRE: no socket volume, no injection template, no certificate provider.
# Upstream ambient mode does not support SPIRE; istiod's CA signs the certificates ztunnel requests
# for the workloads of its node (istiod trusts the ztunnel ServiceAccount istio-system/ztunnel, the
# chart's default CA_TRUSTED_NODE_ACCOUNTS).
profile: ambient
meshConfig:
  trustDomain: ""            # zone fact: zone.trustDomain (required); the interim ionos.trust.invalid
  # The security baseline (ADR 005, docs/adr/tdr-decisions.md) sets TLS 1.3 as the minimum, as in
  # istiod.yaml.
  meshMTLS:
    minProtocolVersion: TLSV1_3
# Images, pinned by tag and digest (the multi-arch index digest of the 1.31.4 tag, read from its
# registry). A value that contains "/" is used by the chart as the whole image reference, so the
# ambient profile's `distroless` variant does not change these references.
global:
  proxy:
    # No pod is injected on the ambient path; istiod still renders this image into its injection
    # configuration (waypoints, gateways), so it is pinned too.
    image: docker.io/istio/proxyv2:1.31.4@sha256:04f0f4a8d494f17ae6c67ee400194f646f90460a220811acaaedafb0c332dd1d
  proxy_init:
    image: docker.io/istio/proxyv2:1.31.4@sha256:04f0f4a8d494f17ae6c67ee400194f646f90460a220811acaaedafb0c332dd1d
pilot:
  image: docker.io/istio/pilot:1.31.4@sha256:4adbb158444f033f11d6814b9c85ff3d13a7f5714cf27cbc64461e4d7d876ddf
base:
  # As in istiod.yaml: fail closed, and every run renders alike.
  validationFailurePolicy: Fail
