# Release `otel-gateway` of a participant zone: the zone gateway, a Deployment of the upstream
# OpenTelemetry Collector chart (contrib image) in the management namespace (ztd-mgmt), installed
# after zone-policy and ztd-openbao so that its pod is created with a sidecar and an SVID.
#   chart source      https://open-telemetry.github.io/opentelemetry-helm-charts, chart
#                     opentelemetry-collector, version and sha256 pinned in scripts/tools/pins.env
#   image             OTEL_COLLECTOR_IMAGE in scripts/tools/pins.env, set by the installer
# Its pods carry app.kubernetes.io/name: otel-collector, the label the allow-matrix row
# workloads-to-otel-collector selects, and the identity label of zone-policy's registration. Jobs:
#   - receive OTLP from the workloads and from the mesh proxies on 4317 (gRPC) and 4318 (HTTP);
#   - scrape the SPIRE server (9988) and the controller-manager (8082) every 5 s through the umbrella's
#     observabilityScrape lane and Service;
#   - read node readiness and the SPIRE agent DaemonSet's desired node count (k8s_cluster receiver,
#     read-only RBAC), for the agents-versus-nodes alert;
#   - probe the revocation status-list URL every 5 s (httpcheck receiver; availability only);
#   - scrape its own metrics (its uptime is the silent-zone signal);
#   - export to the demonstrator cluster's entry with the zone's client certificate, through a
#     bounded in-memory sending queue.
# The installer fills the values marked "installer": the endpoint and server name
# (telemetryExport.entry), the probe URL (telemetryExport.revocationStatusListUrl), the client
# certificate's Secret (telemetryExport.clientSecret) and, on the participant zones, the node pin of
# ztd-openbao (nodeSelector on istiod's node).
mode: deployment
replicaCount: 1
nameOverride: otel-collector
fullnameOverride: otel-gateway
image:
  repository: ""                 # installer: OTEL_COLLECTOR_IMAGE
podLabels:
  spiffe.io/spire-managed-identity: "true"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001                 # the mounted certificates are group-readable (0440)
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
ports:
  otlp: { enabled: true, containerPort: 4317, servicePort: 4317, protocol: TCP, appProtocol: grpc }
  otlp-http: { enabled: true, containerPort: 4318, servicePort: 4318, protocol: TCP }
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }
  metrics: { enabled: false }
service:
  type: ClusterIP
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 384Mi }
clusterRole:
  create: true
  rules:
    # k8s_cluster: node readiness and the SPIRE agent DaemonSet's desired node count, read only.
    - apiGroups: [""]
      resources: [nodes, pods, namespaces, services, replicationcontrollers, resourcequotas]
      verbs: [get, list, watch]
    - apiGroups: [apps]
      resources: [daemonsets, deployments, replicasets, statefulsets]
      verbs: [get, list, watch]
    - apiGroups: [batch]
      resources: [jobs, cronjobs]
      verbs: [get, list, watch]
    - apiGroups: [autoscaling]
      resources: [horizontalpodautoscalers]
      verbs: [get, list, watch]
extraVolumes:
  - name: telemetry-client
    secret:
      secretName: ztd-telemetry-client     # installer: telemetryExport.clientSecret
      defaultMode: 0440
extraVolumeMounts:
  - { name: telemetry-client, mountPath: /etc/ztd-telemetry, readOnly: true }
config:
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
  receivers:
    jaeger: null
    zipkin: null
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    prometheus:
      config:
        scrape_configs:
          - job_name: spire-server
            scrape_interval: 5s
            scrape_timeout: 4s
            static_configs:
              - targets: ["spire-server-metrics.spire-system.svc:9988"]
          - job_name: spire-controller-manager
            scrape_interval: 5s
            scrape_timeout: 4s
            static_configs:
              - targets: ["spire-server-metrics.spire-system.svc:8082"]
          - job_name: otel-gateway
            scrape_interval: 5s
            scrape_timeout: 4s
            static_configs:
              - targets: ["127.0.0.1:8888"]
                labels:
                  collector: otel-gateway     # the silent-zone rules select the gateway's uptime by it
    k8s_cluster:
      collection_interval: 5s
      node_conditions_to_report: [Ready]
      allocatable_types_to_report: []
    http_check/revocation:
      collection_interval: 5s
      targets:
        - endpoint: ""                   # installer: telemetryExport.revocationStatusListUrl
          method: GET
          # Bounded below the 5 s interval and the alert rule's 10 s lookback: a probe that hangs
          # longer than the lookback leaves no sample, and the alert would never fire.
          timeout: 2s
  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch:
      timeout: 1s
      send_batch_size: 512
    # The alerts read health signals only this collector produces (its scrapes, k8s_cluster, the
    # probe), stamped ztd.source=collector. OTLP from the data plane is untrusted, and two layers
    # keep it out of the alerts, either of which suffices: its source is set to workload, overwriting
    # any value the client sent, and every rule selector requires ztd_source="collector"; and
    # filter/reserved drops every metric whose name, as Prometheus stores it (the remote write turns
    # other characters into "_" and trims them at the ends), is or starts a word with a reserved name:
    # the health inputs (up, httpcheck_*, k8s_*, otelcol_*, scrape_*) and the alert series (ALERTS,
    # ALERTS_FOR_STATE), in any case; and the rules' own series (ztd:*; the remote write keeps ":",
    # so only a name with it is stored as one, and ztd_* names such as the proof's claim pass).
    resource/collector:
      attributes:
        - { key: ztd.source, value: collector, action: upsert }
    filter/reserved:
      error_mode: ignore
      metrics:
        metric:
          - 'IsMatch(name, "(?i)^[^a-z0-9]*((up|httpcheck|k8s|otelcol|scrape|alerts)([^a-z0-9]|$)|ztd[^a-z0-9_]*:)")'
    transform/workload:
      error_mode: ignore
      metric_statements:
        - context: resource
          statements:
            - 'delete_key(resource.attributes, "ztd_source")'
            - 'set(resource.attributes["ztd.source"], "workload")'
        - context: datapoint
          statements:
            - 'delete_key(datapoint.attributes, "ztd.source")'
            - 'delete_key(datapoint.attributes, "ztd_source")'
  exporters:
    debug: null
    otlp/entry:
      endpoint: ""                       # installer: <entry host>:<this zone's port>
      compression: gzip
      tls:
        ca_file: /etc/ztd-telemetry/ca.crt
        cert_file: /etc/ztd-telemetry/tls.crt
        key_file: /etc/ztd-telemetry/tls.key
        server_name_override: ""         # installer: telemetryExport.entry.serverName
        min_version: "1.3"
      # Bounded: a full queue refuses new items and counts them (otelcol_exporter_enqueue_failed_*);
      # the workloads' OTLP calls are answered either way.
      sending_queue:
        enabled: true
        sizer: items
        queue_size: 50000
        num_consumers: 4
      # A retry at most every 5 s: once the connection to the entry is back, the backlog follows
      # within seconds. The connection itself reconnects on gRPC's own backoff, which the exporter
      # does not expose; after a 60 s outage that can take up to about a minute.
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 5s
        max_elapsed_time: 30m
  service:
    extensions: [health_check]
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 127.0.0.1
                  port: 8888
    pipelines:
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/entry]
      metrics: null                    # the chart's default pipeline, replaced by the two below
      metrics/collector:
        receivers: [prometheus, k8s_cluster, http_check/revocation]
        processors: [memory_limiter, resource/collector, batch]
        exporters: [otlp/entry]
      metrics/workloads:
        receivers: [otlp]
        processors: [memory_limiter, filter/reserved, transform/workload, batch]
        exporters: [otlp/entry]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/entry]
