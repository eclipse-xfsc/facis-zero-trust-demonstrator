{{- $sel := dict "component" "nats" | merge (dict "Release" .Release "Values" .Values "Chart" .Chart) -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "backbone.nats" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backbone.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  selector:
    {{- include "backbone.selector" $sel | nindent 4 }}
  ports:
    - name: client
      port: 4222
      targetPort: client
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backbone.nats" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backbone.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "backbone.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backbone.labels" . | nindent 8 }}
        app.kubernetes.io/component: nats
    spec:
      serviceAccountName: {{ include "backbone.nats" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: "{{ .Values.images.nats.repository }}@{{ .Values.images.nats.digest }}"
          imagePullPolicy: IfNotPresent
          args: ["--http_port", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 15
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "backbone.nats" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backbone.labels" . | nindent 4 }}
automountServiceAccountToken: false
