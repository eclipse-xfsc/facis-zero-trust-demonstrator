{{- include "wallet.validate" . -}}
{{- /*
One ServiceAccount per component: under the zone's mesh each pod's SPIFFE ID ends in its own
account, spiffe://<trust domain>/ns/<namespace>/sa/<release>-<component>; the SVID comes from the
mesh, not from the account's token, which no pod mounts.
*/ -}}
{{- range $c := list "signer" "storage" "retrieval" "edge" "key" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wallet.component" (dict "Release" $.Release "component" $c) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "wallet.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c }}
automountServiceAccountToken: false
{{- end }}
