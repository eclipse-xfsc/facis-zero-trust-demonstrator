# Values of the zone-policy chart. Every key is documented here and in README.md.

# The zone's SPIFFE trust domain (zone.trustDomain of the zone file; scripts/install-zone fills it).
# No default: the chart refuses to render without it (values.schema.json). The ClusterSPIFFEID takes
# the trust domain from the controller-manager, and the trust-bundle check asserts that the SPIRE
# controller-manager and the mesh both run with this one.
trustDomain: ""

# Where the SPIRE release (`spire`, chart spire 0.30.2) put its pieces. These follow from the
# release name and namespace the installer uses; change them only together with the installer.
spire:
  namespace: spire-system
  # The controller-manager reconciles only ClusterSPIFFEIDs of its class:
  # "<release namespace>-<release name>" in the upstream chart.
  className: spire-system-spire
  serverStatefulSet: spire-server
  agentDaemonSet: spire-agent
  bundleConfigMap: spire-bundle
  controllerManagerConfigMap: spire-controller-manager

# Where the istiod release put the mesh configuration; the mesh-wide PeerAuthentication lives in
# the mesh root namespace by Istio's convention.
mesh:
  namespace: istio-system
  configMap: istio

# Registration by selector (docs/workload-identity.md, "Registration"). Every pod that carries the
# identity label, in a namespace that carries the umbrella's plane label, gets the SPIFFE ID
# spiffe://<trust domain>/ns/<namespace>/sa/<service account>. The label, not the namespace alone,
# is the switch: a pod without it gets no entry, no SVID and, under STRICT, no mesh connection.
registration:
  name: plane-workloads
  identityLabel:
    key: spiffe.io/spire-managed-identity
    value: "true"
  planeLabel: ztd.facis.io/plane

# Mesh-wide peer authentication. STRICT is what makes "no SPIRE entry, no mesh" true: in the
# default permissive mode a proxy without a certificate could still be reached in plaintext.
peerAuthentication:
  mode: STRICT

# No mesh proxy without the SPIRE socket (templates/validatingadmissionpolicy-proxy-spire-socket.yaml).
# In a plane namespace, a pod may not choose its injection templates (inject.istio.io/templates),
# and every mesh proxy of a pod (named istio-proxy, running the proxyv2 image, or naming
# pilot-agent) must mount the SPIFFE CSI driver's volume where Istio looks for the SPIRE socket, so
# a pod cannot drop the `spire` injection template, or run Istio's agent under another name, and
# take a certificate from istiod's CA.
# The volume name and path are those of Istio's `sidecar` template and the istiod values file.
# The same policy keeps the proxy's traffic capture at the injector's defaults: in a plane
# namespace a pod may not exclude a port or an address range from the capture, switch the capture
# off, move the status port, override the proxy's configuration, image, bootstrap or volumes, or, in
# a namespace with the injection label, opt out of injection (README.md, "The capture rule"); and
# every mesh proxy must be the injector's istio-proxy, in a namespace with the injection label, with
# the injector's image, arguments, environment, mounts, lifecycle, probes and securityContext (the
# proxy rule). On a pod update both rules
# check only what the update changes.
proxySocketPolicy:
  name: proxy-takes-spire-socket
  volume: workload-socket
  mountPath: /var/run/secrets/workload-spiffe-uds
  driver: csi.spiffe.io
  # The proxy's status port: the one inbound port the injector excludes from the capture. It MUST
  # equal the istiod release's global.proxy.statusPort (deployment/helm/values/istiod.yaml leaves it
  # at Istio's default, 15020); if the two differ, the policy refuses every injected pod.
  statusPort: 15020
  # The injected proxy's image, the whole reference. It MUST equal the istiod release's
  # global.proxy.image (deployment/helm/values/istiod.yaml); if the two differ, the policy refuses
  # every injected pod. An Istio upgrade changes both.
  proxyImage: docker.io/istio/proxyv2:1.31.1@sha256:d86cba0dd1eb15c00b6901c69ce5ae3d2d5f8427a47751098cf8c3ab2a4a62e9

# Identity-band checks (hook-weight band "identity", 20-39): post-install and post-upgrade Jobs that
# only read, through the Kubernetes API, and fail the release when identity is not there. They run
# in the release namespace under its default deny, through the DNS bypass and the API lane.
checks:
  enabled: true
  image: docker.io/curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
  # How long each check waits for the condition before it fails the release.
  timeoutSeconds: 180

# Mesh authorization (docs/workload-identity.md, "Mesh authorization"). The chart renders the
# mesh-wide default deny (an AuthorizationPolicy `default-deny` with an empty spec in
# mesh.namespace: an ALLOW policy that matches nothing, so every meshed workload refuses every
# request no pair admits; never a DENY policy, which would take precedence over every pair) and one
# AuthorizationPolicy `allow-<name>` per pair, in the destination's namespace: it selects the
# destination by its pod labels and admits the caller by its SPIFFE principal
# (<trustDomain>/ns/<namespace>/sa/<serviceAccount>), or every workload of the source namespace
# when the source is a whole plane, on the destination ports when the pair names any. No rule names
# a path, a method, a host or an address.
# Filled by scripts/install-zone: the umbrella's allowMatrix rows followed by its intraPlanePairs,
# both written once in the zone values (deployment/helm/ztd/values.yaml); the installer refuses a
# zone whose rendered rules are not exactly one per row and pair (pairs_coupling). A release that
# needs pairs between its own pods declares them in its own chart (ztd-openbao), not here.
#   - name: pdp-adapter-to-tsa                          # the rule is allow-<name>
#     from: { plane: data, serviceAccount: pdp-adapter }  # or namespace: <ns>; or wholePlane: true
#     to:
#       plane: management                               # or namespace: <ns>
#       podSelector: { app.kubernetes.io/name: tsa-policy-engine }
#       ports: [{ port: 8443, protocol: TCP }]          # optional; omitted: every port
pairs: []

# The plane namespaces a pair's `plane` resolves to (zone facts: planes.management.namespace and
# planes.data.namespace, filled by scripts/install-zone). Required when a pair names a plane; a
# pair that names its namespace needs neither.
planes:
  management:
    namespace: ""
  data:
    namespace: ""

# The denial log: a Telemetry `mesh-default` in mesh.namespace enables this access-log provider,
# defined by the istiod release (meshConfig.extensionProviders in deployment/helm/values/istiod.yaml),
# for requests and connections the mesh's authorization refused only (the RBAC filter's decision
# detail, never the status code: an application's own 403 is not logged). The destination's proxy
# writes one JSON line to its stdout with both SPIFFE IDs; read it with
# `kubectl logs <pod> -c istio-proxy`. The name MUST equal the istiod release's provider name.
denialLog:
  provider: denial-log
