# The kind zone (deployment/helm/ztd/ci/values.yaml): the CI render and the local proof.
# scripts/install-zone fills trustDomain, the plane namespaces and the pairs from the zone file over
# the umbrella's defaults; CI renders with this file. The pairs are the five allowMatrix rows of the
# umbrella (deployment/helm/ztd/values.yaml) in the shape the installer hands over, and one
# intra-plane pair that exists only here, so that the render shows a same-plane rule as well (it
# names no l7Owner, so it renders the default, sidecar).
trustDomain: kind.facis-ztd.local
planes:
  management:
    namespace: ztd-mgmt
  data:
    namespace: ztd-data
pairs:
  - name: pdp-adapter-to-tsa
    l7Owner: sidecar
    from: { plane: data, serviceAccount: pdp-adapter }
    to: { plane: management, podSelector: { app.kubernetes.io/name: tsa-policy-engine } }
  - name: atls-gateway-to-cmcd
    l7Owner: sidecar
    from: { plane: data, serviceAccount: atls-gateway }
    to: { plane: management, podSelector: { app.kubernetes.io/name: cmcd } }
  - name: atls-gateway-to-tcr
    l7Owner: sidecar
    from: { plane: data, serviceAccount: atls-gateway }
    to: { plane: management, podSelector: { app.kubernetes.io/name: tcr } }
  - name: workloads-to-otel-collector
    l7Owner: sidecar
    from: { plane: data, wholePlane: true }
    to:
      plane: management
      podSelector: { app.kubernetes.io/name: otel-collector }
      ports:
        - { port: 4317, protocol: TCP }
        - { port: 4318, protocol: TCP }
  - name: backend-to-verification-service
    l7Owner: sidecar
    from: { plane: data, serviceAccount: backend }
    to: { plane: management, podSelector: { app.kubernetes.io/name: verification-service } }
  # A render fixture, not a pair of the zone: an intra-plane pair between two releases.
  - name: ci-intra-plane-example
    from: { plane: management, serviceAccount: ci-example-caller }
    to: { plane: management, podSelector: { app.kubernetes.io/name: ci-example-callee }, ports: [{ port: 8080 }] }
