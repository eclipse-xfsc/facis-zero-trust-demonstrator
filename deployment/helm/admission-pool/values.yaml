# The namespaces under admission control. Each carries facis.ztd/admission-proof=true - the label the
# Gatekeeper webhook and the constraints select on - and enforces the restricted Pod Security Standard.
namespaces:
  - ztd-adm-001
  - ztd-adm-002

# The identity the acceptance runner creates test workloads and reads evidence with. Its token is a
# CI secret; it has no cluster-scoped rights and no rights outside these namespaces.
tester:
  serviceAccount:
    create: true
    name: ztd-adm-tester
    namespace: ""   # empty: the first namespace above
