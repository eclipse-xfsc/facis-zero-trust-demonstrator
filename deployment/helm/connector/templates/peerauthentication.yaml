{{- if .Values.identity.spireManagedIdentity }}
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: ztd-connector
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      {{- include "connector.selector" . | nindent 6 }}
  mtls:
    mode: STRICT
{{- end }}
