{{- if and .Values.schema.enabled .Values.serviceAccount.create }}
# The migration runner's own identity, distinct from the connector's: it holds the schema's DDL.
# A hook, one weight below the Job, so it exists when the Job starts; kept across uninstall, as hook
# resources are.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.schema.serviceAccountName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "connector.schemaLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "40"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
{{- end }}
