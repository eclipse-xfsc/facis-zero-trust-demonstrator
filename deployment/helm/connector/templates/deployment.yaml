{{- include "connector.validate" . -}}
{{- $endpoint := include "connector.registrationEndpoint" . -}}
# The connector. A regular resource: its readiness is its own answer, 200 only while the database
# is reachable at the schema it needs, the key-value store is initialised and unsealed, the pinned
# signing key resolves, and the registrar is seeded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "connector.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "connector.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "connector.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "connector.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
        {{- if .Values.identity.spireManagedIdentity }}
        spiffe.io/spire-managed-identity: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      automountServiceAccountToken: false
      # The service's worst case: the drain delay, the shutdown timeout, a readiness evaluation
      # still running when the pool closes, and a margin.
      terminationGracePeriodSeconds: {{ add (int .Values.server.drainDelaySeconds) (int .Values.server.shutdownTimeoutSeconds) (int .Values.server.readinessTimeoutSeconds) 5 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The mounted secrets are owned by root; the group makes them readable to the process.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          args:
            - serve
            - --readiness-timeout={{ int .Values.server.readinessTimeoutSeconds }}s
            - --drain-delay={{ int .Values.server.drainDelaySeconds }}s
            - --shutdown-timeout={{ int .Values.server.shutdownTimeoutSeconds }}s
            - --log-level={{ .Values.server.logLevel }}
          env:
            - name: CONNECTOR_ZONE
              value: {{ .Values.zone | quote }}
            - name: CONNECTOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.secretKey | quote }}
            - name: CONNECTOR_OPENBAO_URL
              value: {{ .Values.openbao.address | quote }}
            - name: CONNECTOR_OPENBAO_TOKEN_FILE
              value: /var/run/secrets/openbao/token
            - name: CONNECTOR_ISSUER
              value: {{ .Values.issuer | quote }}
            - name: CONNECTOR_SIGNING_KEY
              value: {{ .Values.signing.key | quote }}
            - name: CONNECTOR_SIGNING_KEY_VERSION
              value: {{ int .Values.signing.version | quote }}
            - name: CONNECTOR_REGISTRATION_ENDPOINT
              value: {{ $endpoint | quote }}
            - name: CONNECTOR_TOKEN_SECRET_FILE
              value: /var/run/secrets/connector/token-secret
            - name: CONNECTOR_REGISTRATION_SECRET_FILE
              value: /var/run/secrets/connector/registration-secret
            - name: CONNECTOR_REGISTRAR_ID
              value: {{ .Values.registrar.id | quote }}
            - name: CONNECTOR_REGISTRAR_SECRET_FILE
              value: /var/run/secrets/connector/registrar-secret
            - name: CONNECTOR_REGISTRAR_SCOPES
              value: {{ join "," .Values.registrar.scopes | quote }}
            - name: CONNECTOR_REGISTRAR_AUDIENCES
              value: {{ join "," (prepend .Values.registrar.audiences $endpoint) | quote }}
            {{- with .Values.registrar.delegableScopes }}
            - name: CONNECTOR_REGISTRAR_DELEGABLE_SCOPES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.verifiedPresentation.configMap }}
            - name: CONNECTOR_VP_TRUSTED_ISSUERS_FILE
              value: /etc/connector/vp/{{ $.Values.verifiedPresentation.issuersKey }}
            - name: CONNECTOR_VP_SCOPE_MAP_FILE
              value: /etc/connector/vp/{{ $.Values.verifiedPresentation.scopeMapKey }}
            {{- end }}
            - name: CONNECTOR_ACCESS_TOKEN_LIFESPAN
              value: {{ .Values.accessTokenLifespan | quote }}
            - name: CONNECTOR_DPOP_ENFORCE
              value: {{ .Values.dpop.enforce | quote }}
            - name: CONNECTOR_DPOP_NONCE
              value: {{ .Values.dpop.nonce | quote }}
          ports:
            - name: http
              containerPort: 8080
            - name: ops
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 5
            timeoutSeconds: {{ add (int .Values.server.readinessTimeoutSeconds) 1 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secrets
              mountPath: /var/run/secrets/connector
              readOnly: true
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            {{- if .Values.verifiedPresentation.configMap }}
            - name: vp
              mountPath: /etc/connector/vp
              readOnly: true
            {{- end }}
      volumes:
        - name: secrets
          secret:
            secretName: {{ .Values.secrets.existingSecret | quote }}
            defaultMode: 0400
            items:
              - key: {{ .Values.secrets.tokenSecretKey | quote }}
                path: token-secret
              - key: {{ .Values.secrets.registrationSecretKey | quote }}
                path: registration-secret
              - key: {{ .Values.secrets.registrarSecretKey | quote }}
                path: registrar-secret
        - name: openbao-token
          secret:
            secretName: {{ .Values.openbao.existingTokenSecret | quote }}
            defaultMode: 0400
            items:
              - key: {{ .Values.openbao.tokenSecretKey | quote }}
                path: token
        {{- if .Values.verifiedPresentation.configMap }}
        - name: vp
          configMap:
            name: {{ .Values.verifiedPresentation.configMap | quote }}
        {{- end }}
