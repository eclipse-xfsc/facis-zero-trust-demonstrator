{{- if .Values.schema.enabled }}
# The migration Job's lanes, its own: DNS and schema.egress (the database; istiod where meshed).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ztd-connector-schema
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "connector.schemaLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "40"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ztd-connector-schema
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
        - {port: 8053, protocol: UDP}
        - {port: 8053, protocol: TCP}
    {{- toYaml .Values.schema.egress | nindent 4 }}
{{- end }}
