apiVersion: v2
name: ztd-openbao
description: >-
  The secret store of one zone of the FACIS Zero Trust Demonstrator: OpenBao (ZT-11, ADR-0004) as a
  release of its own, the last of a zone (scripts/install-zone/install.sh), so that its server and
  its jobs are created after the mesh and the registration rule and hold a mesh identity from their
  first start. Wraps the upstream openbao chart with the bootstrap Job, the verification hook and
  the external mode.
type: application
version: 0.1.0
appVersion: "2.5.4"
keywords:
  - facis
  - zero-trust
  - openbao
sources:
  - https://github.com/eclipse-xfsc/facis-zero-trust-demonstrator
dependencies:
  # OpenBao (ZT-11, ADR-0004): the key-value and transit store for X.509 key material. Chart 0.28.3
  # ships OpenBao v2.5.4; the chart version and the server version are recorded separately in
  # docs/secrets.md. Built from Chart.lock (scripts/install-zone/install.sh, scripts/ci/check-charts.sh).
  - name: openbao
    version: 0.28.3
    repository: https://openbao.github.io/openbao-helm
