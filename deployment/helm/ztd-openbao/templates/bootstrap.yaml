{{- /*
Bootstrap of the bundled OpenBao (docs/secrets.md). A regular Job, not a hook: a sealed server is not
ready, and with --wait Helm runs post-install hooks only after every regular resource is ready, so a
hook could never unseal it. `helm install --wait --wait-for-jobs` waits for this Job instead.

The Job name carries a hash of the script and of the whole of the chart's values (the upstream
chart's included): an upgrade that changes any value - the server's image, resources or storage,
which restart the server sealed - renders a new Job, which Helm creates and which unseals the
restarted server before --wait gives up; Helm removes the previous Job, no longer in the manifest.
An unchanged upgrade renders the same name, so the manifest is identical and no Job runs. A restart
the lifecycle does not cause (eviction, node reboot) is unsealed by hand (scripts/secrets/unseal.sh). Every run is safe to repeat;
the state lives in the Secret ztd-openbao-bootstrap (keys: unseal-key, root-token until revoked,
verify-token, state = initialized | configured):

  not initialised, no Secret      -> init (1 share), store unseal key + root token, state=initialized
  not initialised, Secret present -> fail: the store was lost; the Secret is never overwritten
  initialised, no Secret          -> fail: never re-initialise
  sealed                          -> unseal with the stored key
  state=initialized               -> enable kv-v2 at secret/ and transit at transit/, create the
                                     fixture transit key and KV value, the ztd-verify policy and a
                                     periodic verification token; check the token; state=configured
  state=configured, root present  -> revoke the root token if it is still valid, then remove it
  state=configured                -> renew the verification token; done

Credentials reach curl through header and body files in a memory volume, never through the command
line or the log; the log names states and HTTP codes only. The Job needs the Kubernetes API: under
Cilium the chart opens that lane itself (below); with another CNI, the umbrella's
networkPolicy.kubeApi must be open in the management plane.

On a meshed zone the pod carries the identity label: it is created with a sidecar and an SVID, it
reaches the server through the main Service (which publishes the sealed pod's address) as mesh
mTLS, and its call to the API server leaves through the sidecar as plain TCP (the API server has
no sidecar) under the Cilium lane below. The native sidecar exits with the bootstrap container.
*/ -}}
{{- $bundled := include "ztd-openbao.bundled" . }}
{{- if and $bundled .Values.external.address }}
{{- fail "openbao.server.enabled and external.address are exclusive: either the release installs OpenBao or it verifies an existing one" }}
{{- end }}
{{- if and .Values.external.address (not (hasPrefix "https://" .Values.external.address)) }}
{{- fail "external.address must be https://: the verification hook sends its token to an OpenBao outside the zone, which the zone's mesh does not protect" }}
{{- end }}
{{- if and .Values.external.address (not .Values.external.verifyTokenSecret) }}
{{- fail "external.address needs external.verifyTokenSecret, the Secret holding the verification token" }}
{{- end }}
{{- if not (or $bundled .Values.external.address) }}
{{- fail "nothing to install or verify: set openbao.server.enabled (the bundled server) or external.address (an existing OpenBao)" }}
{{- end }}
{{- if $bundled }}
{{- if ne .Values.openbao.global.namespace .Values.managementNamespace }}
{{- fail (printf "openbao.global.namespace (%s) must be the management plane namespace managementNamespace (%s)" .Values.openbao.global.namespace .Values.managementNamespace) }}
{{- end }}
{{- if not .Values.openbao.server.dataStorage.storageClass }}
{{- fail "openbao.server.dataStorage.storageClass must be the zone's storage class (zone fact zone.storageClass)" }}
{{- end }}
{{- $ns := .Values.managementNamespace }}
{{- /* the upstream chart's fullname: the release name when it contains "openbao", else <release>-openbao */}}
{{- $server := ternary .Release.Name (printf "%s-openbao" .Release.Name) (contains "openbao" .Release.Name) }}
{{- $name := "ztd-openbao-bootstrap" }}
{{- $script := include "ztd-openbao.bootstrapScript" . }}
{{- /* the whole values: an upgrade that may restart the server reruns the bootstrap (above) */}}
{{- $hash := printf "%s%s" $script (toJson .Values) | sha256sum | trunc 8 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "ztd-openbao.labels" . | nindent 4 }}
---
# Create cannot be limited to one name (Kubernetes RBAC has no resourceNames for create), so the Job
# may create any Secret in the management namespace; it may read and change only its own. It may
# read the server's StatefulSet and pod, by name, to wait for the pod of the current revision.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "ztd-openbao.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: [{{ $server | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: [{{ printf "%s-0" $server | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "ztd-openbao.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
{{- if .Values.cilium.enabled }}
---
# Under Cilium a NetworkPolicy ipBlock does not select the API server - Cilium treats it as the
# kube-apiserver entity, not as an address - so networkPolicy.kubeApi does not open this lane there.
# The bootstrap's lane is a Cilium policy to that entity, for this Job's pods only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}-kube-api
  namespace: {{ $ns }}
  labels:
    {{- include "ztd-openbao.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  egress:
    - toEntities:
        - kube-apiserver
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" $name $hash }}
  namespace: {{ $ns }}
  labels:
    {{- include "ztd-openbao.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "ztd-openbao.podIdentity" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: BAO_ADDR
              value: {{ include "ztd-openbao.address" . | quote }}
            - name: SECRET
              value: {{ $name | quote }}
            - name: STS
              value: {{ $server | quote }}
            - name: POD
              value: {{ printf "%s-0" $server | quote }}
          volumeMounts:
            - name: work
              mountPath: /work
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - {{ $script | quote }}
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
{{- end }}
