apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "admission.name" . }}-trust
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
# One key, so the provider reads repositories and keys of the same revision in a single read.
data:
  policy.json: |
    {{- dict "repositories" .Values.trust.repositories "publicKeys" .Values.trust.publicKeys | toPrettyJson | nindent 4 }}
