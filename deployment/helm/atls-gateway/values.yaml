# The attested-channel gateway (cmd/connector-gateway over internal/atls; docs/attested-channel.md,
# docs/atls-gateway.md). One release holds the zone's roles: `ingress` (the peer zone's channels in,
# one in-zone upstream out) and `egress` (in-zone callers in, the peer zone's ingress out); at least
# one is enabled. Every channel is mutual attestation over TLS 1.3; the gateway has no plain-TLS
# mode and no other mode switch.
#
# The pods carry the label app.kubernetes.io/name=atls-gateway and the service account atls-gateway:
# the contract the umbrella's allow matrix states for the lanes atls-gateway-to-cmcd and
# atls-gateway-to-tcr (deployment/helm/ztd/values.yaml). Workload names start with `name` (ztd-…).
name: ztd-atls-gateway
# The gateway image, by digest only (deployment/docker/atls-gateway).
image: {repository: ghcr.io/eclipse-xfsc/facis-zero-trust-demonstrator/atls-gateway, digest: ""}
# The zone's SPIFFE trust domain: the callers' principals (egress role).
trustDomain: ""
nodeSelector: {}
# Per-pod annotations (the injected images' overrides an admission-labelled namespace needs).
podAnnotations: {}
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}
# The readiness endpoint of each role (GET /healthz): answers only once the startup check passed
# and the role listens, so a pod is Ready when it serves, and a rollout keeps the verified pod
# until the new one is.
healthPort: 8081

# The gateway's zone certificate: a kubernetes.io/tls Secret (tls.crt, tls.key) whose URI subject
# alternative name is the zone's gateway identity, spiffe://<zone>/gateway, issued by the zone PKI.
# It is the identity the peer verifies (ADR-0010, decision 5), never the mesh SVID.
tlsSecret: ""
# PEM of the CA certificate(s) that issued both zones' gateway certificates: the trust anchors.
trustCaCert: ""
# The zone's attester, CMC's cmcd (deployment/helm/cmcd, management plane): the gateway's own
# evidence is produced there and the peer's evidence is verified there, over the umbrella's lane
# atls-gateway-to-cmcd. host:port of its Service.
cmcd:
  address: cmcd.ztd-mgmt.svc.cluster.local:9955

# The startup check (docs/attestation-provisioning.md, step 5): before a role serves, it obtains a
# fresh report from cmcd and requires its measured values to be exactly those of the zone's
# attestation configuration in Git, verified against the metadata CA. A zone whose evidence is not
# the one in Git does not serve. Off only for a render that has no attester to ask.
attestation:
  enabled: true
  # The zone's configuration, deployment/attestation/<zone>.json, as a document (the installer
  # passes the file).
  zone: {}
  # PEM of the CA that signed the zone's reference metadata.
  metadataCaCert: ""
  timeoutSeconds: 30

# Ingress role: the zone's attested entry. The peer zone's egress reaches `port` on the Service;
# every channel is terminated here and its stream forwarded, as it is, to one in-zone upstream.
# Mesh mutual TLS is off on this one port (the channel's own TLS 1.3 and attestation take its
# place) and nowhere else.
ingress:
  enabled: false
  port: 8443
  # spiffe://<peer zone>/gateway: the identity the peer's certificate must carry.
  peerIdentity: ""
  # The in-zone upstream every stream goes to: `name` is both the Service the ingress dials and
  # the value of its pods' label app.kubernetes.io/name (the network lane), `port` the port of both.
  # The Service port must be a TCP port of the mesh (name tcp-…): the forwarded bytes carry the peer
  # zone's Host header, and an HTTP port would have the sidecar route by it.
  upstream: {name: "", port: 8080}
  # The entry's Service: LoadBalancer on the zones, NodePort on kind (nodePort 0: assigned). Local
  # keeps the peer's source address as the entry's network lane sees it (sourceRanges); Cluster lets
  # any node forward and rewrites the source to the node's.
  service: {type: LoadBalancer, port: 443, nodePort: 0, externalTrafficPolicy: Local}
  # Where the entry accepts connections from (the Service's network lane), required.
  sourceRanges: []

# Egress role: in-zone callers send plain TCP streams over mesh mutual TLS to `port`; each is
# carried to the peer zone's ingress over a channel this gateway originates and attests. The egress
# is the one pod of the namespace with a lane out of the cluster: to the peer ingress's address and
# port, nothing else.
egress:
  enabled: false
  port: 8080
  # Each caller: its pods' labels (the network lane) and its service account (the mesh rule).
  callers: []
  # - { serviceAccount: backend, podSelector: { app.kubernetes.io/name: backend } }
  peer:
    name: ""      # the peer zone, e.g. zone-b
    address: ""   # the peer ingress's IPv4 address, a zone fact
    port: 443
    identity: ""  # spiffe://<peer zone>/gateway
