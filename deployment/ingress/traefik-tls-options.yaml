# TLS 1.3 as the minimum on the hosts the Traefik ingress controller terminates (behind TDR-BDD-07).
# Traefik applies the TLSOption named `default` to every router that names no other, and to a
# handshake whose server name it does not serve, so no Ingress needs an annotation. It does not
# reach a router that names its own TLSOption, or a TCP router that passes TLS through. There must
# be exactly one `default` TLSOption among the namespaces the controller watches: with two, Traefik
# drops both and falls back to its built-in minimum, TLS 1.2. Apply it in the controller's namespace:
#
#   kubectl -n <traefik namespace> apply -f deployment/ingress/traefik-tls-options.yaml
#
# Proven against a Traefik on kind by scripts/verify-tls13/verify.sh. The TLS 1.3 cipher suites are
# not configurable in Traefik (docs/crypto-baseline.md).
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
spec:
  minVersion: VersionTLS13
