apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sZtdNaming
metadata:
  name: ztd-naming
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: [Pod]
      - apiGroups: [apps]
        kinds: [Deployment, ReplicaSet, StatefulSet, DaemonSet]
      - apiGroups: [batch]
        kinds: [Job]
    # Only namespaces that opt in to admission control.
    namespaceSelector:
      matchLabels:
        facis.ztd/admission-proof: "true"
  parameters:
    # The project convention: every workload and pod name starts with "ztd-".
    pattern: "^ztd-[a-z0-9-]+$"
