# ztd-allowed-repositories as install.sh renders it with ALLOWED_DIGESTS set.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sZtdAllowedRepositories
metadata:
  name: ztd-allowed-repositories
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: [Pod]
      - apiGroups: [apps]
        kinds: [Deployment, ReplicaSet, StatefulSet, DaemonSet]
      - apiGroups: [batch]
        kinds: [Job]
    namespaceSelector:
      matchLabels:
        facis.ztd/admission-proof: "true"
  parameters:
    repositories:
      - ghcr.io/eclipse-xfsc/facis-zero-trust-demonstrator
    allowedDigests:
      - docker.io/istio/proxyv2@sha256:d86cba0dd1eb15c00b6901c69ce5ae3d2d5f8427a47751098cf8c3ab2a4a62e9
