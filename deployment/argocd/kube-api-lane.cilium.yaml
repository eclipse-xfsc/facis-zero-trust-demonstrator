# Egress from the argocd namespace to the Kubernetes API under Cilium, applied by scripts/argocd/install.sh
# (CILIUM=1) before Argo CD starts. Cilium does not select the API server by address: it is the
# kube-apiserver entity, and a NetworkPolicy ipBlock never matches it (deployment/helm/ztd, the same lane
# for the plane namespaces). Port 443 only, the `kubernetes` Service port: every port would open every
# port of the node the API server runs on. enableDefaultDeny off: this policy adds a lane and leaves the
# deny to the NetworkPolicies of the namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-api-egress
  namespace: argocd
spec:
  description: "argocd pods -> the API server, by entity"
  endpointSelector: {}
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
