# Stand-in pods of the mesh identity proof (scripts/verify-mesh-identity/verify.sh). Nothing here is
# consumed by a zone: the pods carry the labels the proof needs (the identity label
# spiffe.io/spire-managed-identity, the allow-matrix names) and run the images the umbrella's own
# verification uses, plus SPIRE's agent image as the Workload API client that reads the SVID over
# the mounted CSI socket. __DATA__ and __MGMT__ are replaced with the plane namespaces.
# The pods annotated sidecar.istio.io/inject: "false" (unregistered-svid and the two probes) are
# refused by the capture rule of zone-policy's admission policy as written; the proof creates them
# with that one validation lifted and puts it back (verify.sh, section 5).
# Every stand-in that runs a proxy or fetches an SVID runs in a ServiceAccount of its own, named after
# the pod, so its SPIFFE ID (spiffe://<trust domain>/ns/<namespace>/sa/<pod>) reads as its role and no
# two stand-ins share one: the matrix pair and the callers refused on its lane are told apart by
# identity (verify.sh, section 10, stand-in-identities). The two probes hold no identity and keep the
# namespace's default account. Every object here carries app.kubernetes.io/part-of:
# verify-mesh-identity, by which the registration inventory marks the proof's own pods.
# Under the mesh default deny of zone-policy, a stand-in is served only through a declared pair: the
# allow-matrix row pdp-adapter-to-tsa (zone-policy) and the proof's own pairs (fixtures/mesh-pairs.yaml,
# caller -> peer and each mesh-on-<node> to the next). pdp-impostor (the labels of pdp-adapter, an
# account of its own) and unpaired (no pair) are the registered callers the mesh refuses (verify.sh,
# section 11, mesh-default-deny).
#
# A meshed peer that serves HTTP and echoes request headers (agnhost netexec /header).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: peer
  namespace: __DATA__
  labels: { app.kubernetes.io/part-of: verify-mesh-identity }
---
apiVersion: v1
kind: Pod
metadata:
  name: peer
  namespace: __DATA__
  labels: { app.kubernetes.io/name: peer, app.kubernetes.io/part-of: verify-mesh-identity, spiffe.io/spire-managed-identity: "true" }
spec:
  terminationGracePeriodSeconds: 2   # sleep ignores SIGTERM; the stand-ins hold no state
  serviceAccountName: peer
  containers:
    - name: app
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: [netexec, --http-port=8080]
      ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: peer
  namespace: __DATA__
  labels: { app.kubernetes.io/part-of: verify-mesh-identity }
spec:
  selector: { app.kubernetes.io/name: peer }
  ports: [{ name: http, port: 8080 }]
---
# The labelled, meshed caller. Its second container is a Workload API client on the CSI socket.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caller
  namespace: __DATA__
  labels: { app.kubernetes.io/part-of: verify-mesh-identity }
---
apiVersion: v1
kind: Pod
metadata:
  name: caller
  namespace: __DATA__
  labels: { app.kubernetes.io/name: caller, app.kubernetes.io/part-of: verify-mesh-identity, spiffe.io/spire-managed-identity: "true" }
spec:
  terminationGracePeriodSeconds: 2   # sleep ignores SIGTERM; the stand-ins hold no state
  serviceAccountName: caller
  containers:
    - name: app
      image: docker.io/curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
      command: [sleep, "3600"]
    - name: svid
      image: ghcr.io/spiffe/spire-agent:1.15.3@sha256:41b0dcd8b258a69db9e2768292a060766fb76fd866e4bc925849981ea1b825ff
      command: [/opt/spire/bin/spire-agent]
      args: [api, watch, -socketPath, /run/spiffe/socket]
      volumeMounts: [{ name: spiffe-workload-api, mountPath: /run/spiffe, readOnly: true }]
  volumes:
    - name: spiffe-workload-api
      csi: { driver: csi.spiffe.io, readOnly: true }
---
# Same namespace as the caller, an account of its own, no identity label: no entry, so its proxy gets
# no certificate.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unregistered
  namespace: __DATA__
