# The impostor on the lane pdp-adapter-to-tsa: the pod labels of pdp-adapter, so the matrix lane's
# NetworkPolicy admits it, but a service account and so a SPIFFE ID of its own, which the lane's mesh
# rule does not name: the mesh refuses it (verify.sh, section 11, mesh-default-deny).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdp-impostor
  namespace: __DATA__
  labels: { app.kubernetes.io/part-of: verify-mesh-identity }
---
apiVersion: v1
kind: Pod
