# The observability-export destination, in the management namespace __NS__, created only when no collector
# of the allow-matrix row workloads-to-otel-collector runs there: its labels and service account, so the
# row's lanes (NetworkPolicy pair, AuthorizationPolicy allow-workloads-to-otel-collector) admit the export.
# Its service account otel-collector is created by the proof only when missing.
apiVersion: v1
kind: Pod
metadata:
  name: route-otel-stand-in
  namespace: __NS__
  labels: { app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: verify-connector-routing, spiffe.io/spire-managed-identity: "true" }
spec:
  activeDeadlineSeconds: 7200
  terminationGracePeriodSeconds: 2
  serviceAccountName: otel-collector
  containers:
    - name: app
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: [porter]
      env:
        - { name: SERVE_PORT_4318, value: otlp-http-stand-in }
      ports:
        - { containerPort: 4318 }
---
apiVersion: v1
kind: Service
metadata:
  name: route-otel-stand-in
  namespace: __NS__
  labels: { app.kubernetes.io/part-of: verify-connector-routing }
spec:
  selector: { app.kubernetes.io/name: otel-collector }
  ports:
    - { name: http-4318, port: 4318 }
