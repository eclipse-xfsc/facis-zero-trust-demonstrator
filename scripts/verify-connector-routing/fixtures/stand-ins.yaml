# Stand-in pods of scripts/verify-connector-routing/verify.sh, in the route namespace __NS__ (the data plane).
# Their service accounts are created by the proof only when missing, and removed only when it created them.
# - route-backend: the caller the connector gateway admits (its labels and its service account, the zone's
#   participant backend), and the source of the direct-path, DNS and observability probes;
# - route-impostor: the same labels under another service account, which the gateway's proxy must refuse.
apiVersion: v1
kind: Pod
metadata:
  name: route-backend
  namespace: __NS__
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: verify-connector-routing, spiffe.io/spire-managed-identity: "true" }
spec:
  activeDeadlineSeconds: 7200   # a stand-in left by a killed run stops on its own after 2 h
  terminationGracePeriodSeconds: 2
  serviceAccountName: backend
  containers:
    - name: app
      image: docker.io/curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
      command: [sleep, "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: route-impostor
  namespace: __NS__
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: verify-connector-routing, spiffe.io/spire-managed-identity: "true" }
spec:
  activeDeadlineSeconds: 7200
  terminationGracePeriodSeconds: 2
  serviceAccountName: route-impostor
  containers:
    - name: app
      image: docker.io/curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
      command: [sleep, "3600"]
