# The proof's instrumented echo (tools/trace-echo) as a meshed data-plane workload: its proxy emits a
# span per request (zone-policy's Telemetry resource) and the echo emits the child span, both to the
# zone gateway (OTLP/HTTP on 4318, the allow-matrix row workloads-to-otel-collector). Placeholders:
# ${NS_DATA}, ${NS_MGMT}, ${ECHO_IMAGE}, ${PIN}.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-echo
  namespace: ${NS_DATA}
  labels: { app.kubernetes.io/name: trace-echo, app.kubernetes.io/part-of: verify-observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: trace-echo }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trace-echo
        app.kubernetes.io/part-of: verify-observability
        spiffe.io/spire-managed-identity: "true"
    spec:
      ${PIN}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: trace-echo
          image: ${ECHO_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-gateway.${NS_MGMT}.svc.cluster.local:4318" }
            - { name: OTEL_SERVICE_NAME, value: trace-echo }
          ports:
            - { containerPort: 8080, name: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: trace-echo
  namespace: ${NS_DATA}
  labels: { app.kubernetes.io/part-of: verify-observability }
spec:
  selector: { app.kubernetes.io/name: trace-echo }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
