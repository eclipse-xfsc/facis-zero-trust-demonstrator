# Stand-in for TSPA (trust-list publication), the destination of the DENY row "any data-plane workload ->
# TSPA" of docs/architecture.md section 6 (scripts/verify-plane-separation/verify.sh). Created in the
# management-plane namespace __MGMT__ only when the zone runs no pod labelled app.kubernetes.io/name: tspa;
# meshed, so the mesh layer's refusal behind a probe-scoped opening is shown on it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tspa
  namespace: __MGMT__
  labels: { app.kubernetes.io/part-of: verify-plane-separation }
---
apiVersion: v1
kind: Pod
metadata:
  name: tspa
  namespace: __MGMT__
  labels: { app.kubernetes.io/name: tspa, app.kubernetes.io/part-of: verify-plane-separation, spiffe.io/spire-managed-identity: "true" }
  annotations: { verify-plane-separation/role: destination }
spec:
  activeDeadlineSeconds: 7200   # a stand-in left by a killed run stops on its own after 2 h
  terminationGracePeriodSeconds: 2
  serviceAccountName: tspa
  containers:
    - name: app
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: [porter]
      env:
        - { name: SERVE_PORT_8080, value: tspa-8080 }
      ports:
        - { containerPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: tspa
  namespace: __MGMT__
  labels: { app.kubernetes.io/part-of: verify-plane-separation }
spec:
  selector: { app.kubernetes.io/name: tspa }
  ports:
    - { name: http-8080, port: 8080 }
