# Stand-ins of the allowMatrix row backend-to-verification-service (scripts/verify-plane-separation/verify.sh). Each object carries
# app.kubernetes.io/part-of: verify-plane-separation; each pod carries exactly the row's labels and service
# account (verify_test.sh holds them to the rendered row), plus the SPIRE registration label. __TO__ is the
# destination's namespace, __FROM__ the data-plane namespace the callers run in. The destination is
# created only when the zone runs no pod matching the row's selector and service account (design D6);
# the callers are always stand-ins.
# The destination: agnhost porter answers on every port it is given (SERVE_PORT_<port>).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verification-service
  namespace: __TO__
  labels: { app.kubernetes.io/part-of: verify-plane-separation }
---
apiVersion: v1
kind: Pod
metadata:
  name: verification-service
  namespace: __TO__
  labels: { app.kubernetes.io/name: verification-service, app.kubernetes.io/part-of: verify-plane-separation, spiffe.io/spire-managed-identity: "true" }
  annotations: { verify-plane-separation/role: destination }
spec:
  activeDeadlineSeconds: 7200   # a stand-in left by a killed run stops on its own after 2 h
  terminationGracePeriodSeconds: 2
  serviceAccountName: verification-service
  containers:
    - name: app
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: [porter]
      env:
        - { name: SERVE_PORT_8080, value: verification-service-8080 }
      ports:
        - { containerPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: verification-service
  namespace: __TO__
  labels: { app.kubernetes.io/part-of: verify-plane-separation }
spec:
  selector: { app.kubernetes.io/name: verification-service }
  ports:
    - { name: http-8080, port: 8080 }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: __FROM__
  labels: { app.kubernetes.io/part-of: verify-plane-separation }
---
# The legitimate caller: the row's labels and service account.
apiVersion: v1
kind: Pod
metadata:
  name: backend-to-verification-service-caller
  namespace: __FROM__
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: verify-plane-separation, spiffe.io/spire-managed-identity: "true" }
  annotations: { verify-plane-separation/role: caller }
spec:
  activeDeadlineSeconds: 7200   # a stand-in left by a killed run stops on its own after 2 h
  terminationGracePeriodSeconds: 2
  serviceAccountName: backend
  containers:
    - name: app
      image: docker.io/curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
      command: [sleep, "3600"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-to-verification-service-impostor
  namespace: __FROM__
  labels: { app.kubernetes.io/part-of: verify-plane-separation }
---
# The impostor: the row's labels under another service account; the mesh refuses it.
apiVersion: v1
kind: Pod
metadata:
  name: backend-to-verification-service-impostor
  namespace: __FROM__
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: verify-plane-separation, spiffe.io/spire-managed-identity: "true" }
  annotations: { verify-plane-separation/role: impostor }
spec:
  activeDeadlineSeconds: 7200   # a stand-in left by a killed run stops on its own after 2 h
  terminationGracePeriodSeconds: 2
  serviceAccountName: backend-to-verification-service-impostor
  containers:
    - name: app
      image: docker.io/curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
      command: [sleep, "3600"]
---
# The unlabelled caller: the row's service account without its labels; the network layer drops it.
apiVersion: v1
kind: Pod
metadata:
  name: backend-to-verification-service-unlabelled
  namespace: __FROM__
  labels: { app.kubernetes.io/part-of: verify-plane-separation, spiffe.io/spire-managed-identity: "true" }
  annotations: { verify-plane-separation/role: unlabelled }
spec:
  activeDeadlineSeconds: 7200   # a stand-in left by a killed run stops on its own after 2 h
  terminationGracePeriodSeconds: 2
  serviceAccountName: backend
  containers:
    - name: app
      image: docker.io/curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
      command: [sleep, "3600"]
