# Stand-in data-plane destination for the management plane -> data plane direction (section 6's row
# management-to-data; scripts/verify-plane-separation/verify.sh). Created in the data-plane namespace __NS__
# only when it runs no meshed Service; meshed and registered, so the mesh layer's refusal of a
# management-plane caller is shown on it behind a probe-scoped opening. It carries no allowMatrix row's
# labels: no row has a data-plane destination.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-target
  namespace: __NS__
  labels: { app.kubernetes.io/part-of: verify-plane-separation }
---
apiVersion: v1
kind: Pod
metadata:
  name: data-target
  namespace: __NS__
  labels: { app.kubernetes.io/name: data-target, app.kubernetes.io/part-of: verify-plane-separation, spiffe.io/spire-managed-identity: "true" }
  annotations: { verify-plane-separation/role: destination }
spec:
  activeDeadlineSeconds: 7200   # a stand-in left by a killed run stops on its own after 2 h
  terminationGracePeriodSeconds: 2
  serviceAccountName: data-target
  containers:
    - name: app
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: [porter]
      env:
        - { name: SERVE_PORT_8080, value: data-target-8080 }
      ports:
        - { containerPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: data-target
  namespace: __NS__
  labels: { app.kubernetes.io/part-of: verify-plane-separation }
spec:
  selector: { app.kubernetes.io/name: data-target }
  ports:
    - { name: http-8080, port: 8080 }
