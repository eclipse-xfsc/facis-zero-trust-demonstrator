# Source: guard/templates/workloads.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ztd-guard
  namespace: ztd-data
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ztd-guard}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ztd-guard
        app.kubernetes.io/part-of: facis-zero-trust-demonstrator
        spiffe.io/spire-managed-identity: "true"
      annotations:
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      serviceAccountName: ztd-guard
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guard
          image: "ghcr.io/fune5tiatlas/facis-zero-trust-demonstrator/guard@sha256:97f74a9cd2bc3bd1da0449dfbe2169fea66c1de87e030a0c9d67aa92140c488f"
          args: ["--config=/etc/runtime/config.json"]
          volumeMounts: [{name: config, mountPath: /etc/runtime, readOnly: true}]
          ports:
            - {name: ops, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /healthz, port: ops}
          livenessProbe:
            httpGet: {path: /healthz, port: ops}
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
        - name: envoy
          image: "ghcr.io/fune5tiatlas/facis-zero-trust-demonstrator/envoy-runtime@sha256:0cd70a69172bb144ba70ed7cad61f3f5172f971c5e130ef48116e60e5fa815c1"
          args: ["-c", "/etc/runtime/envoy.yaml", "--log-level", "warning", "--concurrency", "2"]
          volumeMounts: [{name: config, mountPath: /etc/runtime, readOnly: true}, {name: tmp, mountPath: /tmp}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: http}
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          configMap: {name: ztd-guard-config}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
