# Source: guard/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ztd-guard-config
  namespace: ztd-data
data:
  config.json: "{\"allowed_callers\":[\"spiffe://zone-a.trust.invalid/ns/ztd-data/sa/ztd-participant\"],\"event_source\":\"guard-a\",\"inbound_audience\":\"https://guard.facis.invalid\",\"issuer\":\"https://connector.zone-a.invalid\",\"jwks_url\":\"http://ztd-connector:8080/.well-known/jwks.json\",\"peer_zone\":\"zone-a\",\"policy_url\":\"http://ztd-policy-evaluator:8080\",\"published_base_url\":\"http://ztd-guard:8080\",\"scope_tenants\":{\"report:read\":\"report-read\",\"report:summary\":\"report-summary\"},\"store_url\":\"http://ztd-token-store:8080\",\"upstream_audience\":\"https://resource.facis.invalid\"}"
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 127.0.0.1, port_value: 9901}
    static_resources:
      listeners:
        - name: guarded
          address:
            socket_address: {address: 0.0.0.0, port_value: 8080}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: guarded
                    use_remote_address: true
                    # Preserve only the trusted sidecar's XFCC for the local hook. The hook removes it upstream.
                    forward_client_cert_details: ALWAYS_FORWARD_ONLY
                    route_config:
                      name: protected
                      virtual_hosts:
                        - name: protected
                          domains: ["ztd-guard:8080"]
                          routes:
                            - match: {path: /demo}
                              route:
                                cluster: resource
                                timeout: 15s
                                host_rewrite_literal: "ztd-protected-resource.ztd-data.svc.cluster.local"
                    http_filters:
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          transport_api_version: V3
                          failure_mode_allow: false
                          status_on_error: {code: ServiceUnavailable}
                          grpc_service:
                            envoy_grpc: {cluster_name: hook}
                            timeout: 9s
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          suppress_envoy_headers: true
      clusters:
        - name: resource
          type: STRICT_DNS
          connect_timeout: 1s
          load_assignment:
            cluster_name: resource
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: ztd-protected-resource, port_value: 8080}
        - name: hook
          type: STATIC
          connect_timeout: 1s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: hook
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: 127.0.0.1, port_value: 50051}
